# Tirocinium API — dependency pins and tool configuration (Phase 0.2).
#
# Ranges here are compatibility bounds; the committed uv.lock is the exact pin
# (decision 0002). `infra/setup.sh` provisions this environment in one command.
# The dependency set is the one named in the phases document, milestone 0.2;
# zstandard is the temporary Python fallback that milestone 1.2 removes when
# the Rust codec lands in platform_core. Litestream is a binary in infra/, not
# a Python package.

[project]
name = "tirocinium-api"
version = "0.1.0"
description = "Tirocinium backend: FastAPI application over SQLite shards with Rust extensions"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.9,<3.0",
    "arq>=0.26,<1.0",
    "redis>=5.0,<7.0",
    "httpx>=0.27,<1.0",
    "python-multipart>=0.0.9,<1.0",
    "argon2-cffi>=23.1,<26.0",
    "pyjwt>=2.9,<3.0",
    "boto3>=1.35,<2.0",
    "zstandard>=0.23,<1.0",
    "anthropic>=0.40,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<2.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",
    "maturin>=1.7,<2.0",
]

[tool.uv]
# The API app is an environment, not an installable distribution; nothing
# imports "tirocinium-api". Modules are run from the source tree.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    "RUF",      # ruff-specific
]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "stubs"
files = ["mastery_store"]

[tool.pytest.ini_options]
testpaths = ["mastery_store"]
asyncio_mode = "auto"
