# Tirocinium dev services (Phase 0.1/0.2): object storage and the queue broker.
# SQLite is a file, not a service; scans and figures live in MinIO (backend
# guide 3.3), and arq workers coordinate through Redis (backend guide 4).
#
#   docker compose -f infra/docker-compose.yml up -d
#
# Credentials are dev-only and referenced by the API's local settings; nothing
# here is a production configuration.

name: tirocinium-dev

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    environment:
      MINIO_ROOT_USER: tirocinium
      MINIO_ROOT_PASSWORD: tirocinium-dev
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  minio-data:
  redis-data:
