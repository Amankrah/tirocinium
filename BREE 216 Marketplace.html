["LMS-GALV-SH10","Plate & sheet","G90 hot-dip galvanised sheet, ASTM A653","1.0 mm · 1220 × 2440 mm",6.40,"kg",1,10,2,"in",0,"galv",{rho:7850,sy:230,su:330,E:200,hb:"95 HB",K:52,a:12.0,tmax:200,corr:3,food:0,uv:4,recy:95,ee:28,kic:130,el:30},["corrosion resistant","formable"],"Mild steel with a 275 g/m² zinc coating on both faces — roughly 20 µm per side. In rural atmosphere the zinc gives 40+ years of sacrificial protection; in a fertiliser hopper it is consumed in a season.","Shear or laser cut, roll-form or brake. Every cut edge exposes bare steel — zinc-rich paint the edges or accept sacrificial edge creep."],
["LMS-HSS-5032","Structural tube","Galvanised HSS square tube, ASTM A500B","50 × 50 × 3.2 mm · 6.1 m",17.90,"m",4.94,1,3,"in",7.50,"galv",{rho:7850,sy:317,su:400,E:200,hb:"120 HB",K:52,a:12.0,tmax:200,corr:3,food:0,uv:4,recy:95,ee:28,kic:130,el:23},["structural","galvanised","bolt-together"],"The greenhouse and equipment-frame standard. Closed section gives high torsional stiffness for its mass, and the G90 galvanising survives humid growing environments far better than painted steel.","Cold-saw cut, GMAW weld (grind galvanising back 25 mm from the joint and re-coat), or bolt with self-drilling fasteners to avoid burning the zinc."],
["LMS-HSS-5048","Structural tube","Galvanised HSS square tube, ASTM A500B","50 × 50 × 4.8 mm · 6.1 m",24.60,"m",8.62,1,3,"in",7.50,"galv",{rho:7850,sy:317,su:400,E:200,hb:"120 HB",K:52,a:12.0,tmax:200,corr:3,food:0,uv:4,recy:95,ee:28,kic:130,el:23},["structural","galvanised"],"Heavier wall for columns and highly loaded rafters. Note that going from 3.2 to 4.8 mm wall raises mass 74 % but second moment of area only about 40 % — a bigger, thinner tube is usually the more efficient answer.","Same as 3.2 mm wall; the heavier section is more forgiving of weld heat input."],
["LMS-HSS-7648","Structural tube","Galvanised HSS square tube, ASTM A500B","76 × 76 × 4.8 mm · 6.1 m",37.80,"m",14.17,1,4,"in",9.00,"galv",{rho:7850,sy:317,su:400,E:200,hb:"120 HB",K:52,a:12.0,tmax:200,corr:3,food:0,uv:4,recy:95,ee:28,kic:130,el:23},["structural","high stiffness"],"Main-column section for wide-span greenhouse and silo structures. Section modulus is roughly 2.4× the 50 mm tube for 1.6× the mass — a good illustration of why depth beats mass in bending.","Cold-saw cut, welded base-plate connections, hot-dip re-galvanise the assembly (MFW-GALV-HD)."],
["LMS-PIPE-S40-50","Structural tube","Galvanised steel pipe, Schedule 40","50 mm NPS · 6.4 m",21.40,"m",5.43,1,3,"in",7.50,"galv",{rho:7850,sy:240,su:400,E:200,hb:"115 HB",K:52,a:12.0,tmax:200,corr:3,food:0,uv:4,recy:95,ee:28,kic:130,el:25},["structural","hoop"],"Round galvanised pipe — the traditional hoop-house arch. Round sections shed snow and wind loads well and can be roll-bent to a radius, which square tube resists.","Roll-bend cold, swage or slip-fit joints, or weld with zinc removed and re-coated."],
["LMS-6061-PL06","Aluminium","6061-T6 aluminium plate","6 mm · 1220 × 2440 mm",9.85,"kg",1,10,3,"in",0,"alum",{rho:2700,sy:276,su:310,E:69,hb:"95 HB",K:167,a:23.6,tmax:200,corr:4,food:0,uv:5,recy:95,ee:155,kic:29,el:12},["light","corrosion resistant","weldable"],"The general-purpose structural aluminium. Specific strength is roughly triple A36, it forms a self-healing oxide film, and it needs no coating outdoors — but it costs about twice as much per kilogram and only a third the stiffness.","Router or waterjet cut, GMAW/GTAW weld with 4043 or 5356 filler. Note that welding anneals the T6 temper in the heat-affected zone, dropping local strength by about 40 %."],
["LMS-6061-BAR","Aluminium","6061-T6 aluminium round bar","Ø50 mm · 3.66 m",10.40,"kg",1,3,3,"in",4.50,"alum",{rho:2700,sy:276,su:310,E:69,hb:"95 HB",K:167,a:23.6,tmax:200,corr:4,food:0,uv:5,recy:95,ee:155,kic:29,el:12},["machinable","light"],"Free-machining structural bar. Cuts three to four times faster than steel, which often makes the finished-part cost lower than steel despite the higher material price.","Turn and mill at high surface speed with polished-flute tooling; anodise for extra surface hardness."],
["LMS-6063-ANG","Aluminium","6063-T5 extruded angle","40 × 40 × 3 mm · 4.9 m",8.40,"m",0.62,2,4,"in",4.00,"alumext",{rho:2700,sy:145,su:186,E:69,hb:"60 HB",K:201,a:23.4,tmax:200,corr:4,food:0,uv:5,recy:95,ee:155,kic:29,el:12},["extruded","light","assembly"],"Architectural extrusion alloy — lower strength than 6061 but far better extrudability, so complex glazing-bar and channel profiles are economical. This is what most greenhouse glazing frames are made from.","Mitre cut, bolt or rivet assembly. Custom die profiles are available (MFW-EXTRUDE-DIE) — worth it above roughly 300 m of production."],
["LMS-6061-TUBE","Aluminium","6061-T6 square tube","50 × 50 × 3.2 mm · 4.9 m",19.80,"m",1.62,1,4,"in",5.00,"alumext",{rho:2700,sy:276,su:310,E:69,hb:"95 HB",K:167,a:23.6,tmax:200,corr:4,food:0,uv:5,recy:95,ee:155,kic:29,el:12},["light","corrosion resistant"],"Direct like-for-like alternative to the galvanised steel HSS above: same outside dimensions, one third the mass per metre, no coating needed — and a little more expensive per metre. Compare the two on the compare tool.","Mitre cut, GMAW weld or use bolted corner castings for demountable frames."],
["LMS-5052-SH","Aluminium","5052-H32 marine-grade aluminium sheet","2 mm · 1220 × 2440 mm",10.90,"kg",1,10,3,"in",0,"alum",{rho:2680,sy:193,su:228,E:70,hb:"60 HB",K:138,a:23.8,tmax:150,corr:5,food:0,uv:5,recy:95,ee:155,kic:32,el:12},["formable","marine corrosion"],"Magnesium-alloyed sheet with the best corrosion resistance of the common aluminiums, including resistance to salt and fertiliser splash. It also forms far better than 6061, so it is the sheet-metal choice for hopper and tank skins.","Shear or laser cut, press-brake to tight radii, GTAW weld with 5356 filler."],
["LMS-7075-PL","Aluminium","7075-T651 aluminium plate","12 mm · 1220 × 2440 mm",19.60,"kg",1,10,6,"lo",0,"alum",{rho:2810,sy:503,su:572,E:72,hb:"150 HB",K:130,a:23.6,tmax:120,corr:2,food:0,uv:4,recy:92,ee:170,kic:24,el:11},["very high strength","aerospace"],"Zinc-alloyed aluminium with steel-level yield strength at a third the density. It is also essentially unweldable, susceptible to stress-corrosion cracking, and double the price of 6061 — specify it only when specific strength genuinely governs.","Machined from solid and mechanically fastened. Anodise or alclad for corrosion protection."],
["LMS-CI-G30","Cast & specialty","Grey cast iron bar, class 30","Ø75 mm · 1.0 m",6.10,"kg",1,3,7,"in",6.00,"castiron",{rho:7150,sy:0,su:214,E:100,hb:"200 HB",K:46,a:10.8,tmax:400,corr:2,food:0,uv:3,recy:90,ee:20,kic:15,el:0},["damping","wear","brittle"],"Graphite flakes make grey iron self-lubricating and give it exceptional vibration damping — roughly ten times mild steel. It has essentially no ductility, so never use it where an impact or tensile overload is credible.","Machined from continuous-cast bar or sand cast to shape. Not weldable by conventional means."],
["LMS-DI-6545","Cast & specialty","Ductile iron bar, ASTM A536 65-45-12","Ø75 mm · 1.0 m",7.30,"kg",1,3,7,"in",6.00,"castiron",{rho:7100,sy:310,su:448,E:169,hb:"170 HB",K:33,a:11.0,tmax:450,corr:2,food:0,uv:3,recy:90,ee:22,kic:35,el:12},["castable","tough","wear"],"Spheroidal graphite gives iron real ductility — 12 % elongation versus zero for grey iron — while keeping castability and machinability. This is what modern tractor wheel hubs and gearbox housings are made of.","Sand or shell cast near net shape, then machined. Austemper (ADI) for a further doubling of strength."],
["LMS-REBAR-15M","Cast & specialty","Deformed reinforcing bar, CSA G30.18 400W","15M (Ø16 mm) · 6 m",1.62,"kg",1,50,2,"in",0,"rebar",{rho:7850,sy:400,su:600,E:200,hb:"140 HB",K:52,a:12.0,tmax:400,corr:1,food:0,uv:2,recy:99,ee:22,kic:120,el:14},["cheapest steel","concrete"],"The cheapest structural steel you can buy per kilogram — under a third the price of plate, because the surface finish and dimensional tolerance are irrelevant inside concrete. A useful lower bound for any $/kg comparison.","Shear cut and bent cold on a rebar bender; lap-spliced, not welded, unless grade W is specified."],
["LMS-CORTEN","Cast & specialty","Weathering steel plate, ASTM A588 / COR-TEN A","6 mm · 1220 × 2440 mm",8.20,"kg",1,25,5,"in",0,"corten",{rho:7850,sy:345,su:485,E:200,hb:"150 HB",K:48,a:12.5,tmax:400,corr:3,food:0,uv:4,recy:97,ee:26,kic:120,el:21},["self-protecting","no paint"],"Copper- and chromium-bearing steel that forms a tight adherent rust layer which then stops further corrosion. It needs alternating wet and dry cycles to work — do not bury it, immerse it, or use it where runoff will stain concrete.","Cut and weld as for A36 but with matching weathering-grade consumables, otherwise the weld corrodes preferentially."]
],
BSA:[
["BSA-304-2B","Austenitic 300-series","AISI 304 stainless sheet, 2B mill finish","1.5 mm · 1220 × 2440 mm",11.20,"kg",1,10,3,"in",0,"stain",{rho:8000,sy:215,su:505,E:193,hb:"70 HRB",K:16.2,a:17.3,tmax:870,corr:4,food:1,uv:5,recy:90,ee:57,kic:200,el:40},["food grade","weldable","formable"],"The default food-contact stainless: 18 % chromium, 8 % nickel, fully austenitic and non-magnetic. It resists most organic acids and cleaning chemicals but is attacked by chlorides — which is why dairy sanitisers push designers to 316.","Laser or waterjet cut, press-brake formed, GTAW welded with 308L filler, then passivated (MFW-PASSIVATE)."],
["BSA-304L-PL","Austenitic 300-series","AISI 304L stainless plate, low carbon","3 mm · 1220 × 2440 mm",12.10,"kg",1,10,3,"in",0,"stain",{rho:8000,sy:200,su:485,E:193,hb:"70 HRB",K:16.2,a:17.3,tmax:870,corr:4,food:1,uv:5,recy:90,ee:57,kic:200,el:40},["weldable","no sensitisation"],"The L means carbon below 0.03 %, which prevents chromium-carbide precipitation at grain boundaries during welding. Without it a welded 304 part corrodes in a band either side of every weld — the classic weld-decay failure.","Same fabrication as 304, but no post-weld solution anneal is required, which is why every welded vessel uses the L grade."],
["BSA-316-2B","Austenitic 300-series","AISI 316 stainless sheet, 2B mill finish","1.5 mm · 1220 × 2440 mm",15.40,"kg",1,10,3,"in",0,"stain",{rho:8000,sy:240,su:550,E:193,hb:"79 HRB",K:16.3,a:16.0,tmax:870,corr:5,food:1,uv:5,recy:90,ee:62,kic:190,el:40},["food grade","chloride resistant"],"Two to three percent molybdenum is the entire difference from 304, and it roughly triples resistance to chloride pitting. That is worth about 38 % more money — the single most common material-selection trade-off in food equipment.","Identical to 304 but weld with 316L filler. Never mix 304 and 316 in the same wetted circuit without checking galvanic compatibility."],
["BSA-316L-2B","Austenitic 300-series","AISI 316L stainless sheet, 2B mill finish","1.5 mm · 1220 × 2440 mm",16.20,"kg",1,10,3,"in",0,"stain",{rho:8000,sy:220,su:530,E:193,hb:"79 HRB",K:16.3,a:16.0,tmax:870,corr:5,food:1,uv:5,recy:90,ee:62,kic:190,el:40},["food grade","weldable","3-A"],"The workhorse of dairy, brewing and pharmaceutical equipment: chloride-resistant and immune to weld sensitisation. If you are specifying a milk-contact surface and cannot justify anything else, this is the safe answer.","Laser cut, formed, GTAW or orbital welded (MFW-ORBITAL-W), passivated and documented for 3-A compliance."],
["BSA-316L-N4","Austenitic 300-series","AISI 316L sheet, No.4 brushed finish Ra ≤ 0.8 µm","1.5 mm · 1220 × 2440 mm",18.90,"kg",1,10,4,"in",0,"stainbr",{rho:8000,sy:220,su:530,E:193,hb:"79 HRB",K:16.3,a:16.0,tmax:870,corr:5,food:1,uv:5,recy:90,ee:64,kic:190,el:40},["food grade","cleanable","3-A"],"Same alloy as the sheet above with a directional brushed finish. The 3-A sanitary standard requires product-contact surfaces at Ra ≤ 0.8 µm; rougher surfaces harbour biofilm in the grinding grooves and cannot be reliably cleaned in place.","Handle with protective film on. Always orient the brush lines to drain, so cleaning solution runs along the grain rather than across it."],
["BSA-316L-EP","Austenitic 300-series","AISI 316L sheet, electropolished Ra ≤ 0.4 µm","1.5 mm · 1220 × 2440 mm",26.40,"kg",1,10,8,"lo",0,"stain",{rho:8000,sy:220,su:530,E:193,hb:"79 HRB",K:16.3,a:16.0,tmax:870,corr:5,food:1,uv:5,recy:88,ee:70,kic:190,el:40},["ultra-clean","pharma"],"Electropolishing removes the deformed surface layer and leaves a chromium-enriched passive film. It roughly doubles pitting resistance and halves protein adhesion — but it costs 63 % more than plain 2B, so reserve it for genuinely aseptic surfaces.","Fabricate and weld first, electropolish last (MFW-ELECTROPOL). Welds must be fully penetrated and ground flush or the process will etch the crevice."],
["BSA-316L-TUBE","Sanitary tube & fittings","316L sanitary tube, 3-A certified","Ø38.1 × 1.65 mm · 6.1 m",58.40,"m",1.51,1,4,"in",12.00,"stain",{rho:8000,sy:220,su:530,E:193,hb:"79 HRB",K:16.3,a:16.0,tmax:870,corr:5,food:1,uv:5,recy:90,ee:66,kic:190,el:40},["3-A","food grade","ID polished"],"Seamless-quality welded tube with the internal weld bead rolled flush and polished to Ra ≤ 0.8 µm. Ordinary industrial pipe has a proud internal bead that is a guaranteed bacterial harbour — never substitute it in a milk line.","Cut with a tube saw (never an abrasive wheel — embedded grit causes pitting), deburr, orbital weld with full argon purge inside and out."],
["BSA-304-TUBE","Sanitary tube & fittings","304 welded tube, industrial finish","Ø38.1 × 1.65 mm · 6.1 m",41.20,"m",1.51,1,3,"in",12.00,"stain",{rho:8000,sy:215,su:505,E:193,hb:"70 HRB",K:16.2,a:17.3,tmax:870,corr:4,food:1,uv:5,recy:90,ee:60,kic:200,el:40},["industrial","structural"],"The same geometry as the sanitary tube above at 29 % less money — because the interior is as-welded, not polished. Excellent for frames, guards and non-product-contact service; unacceptable for anything the milk touches.","Cut, deburr, GTAW weld. Use for structural and utility circuits only."],
["BSA-316L-HX","Sanitary tube & fittings","316L heat-exchanger plate stock, embossed-ready","0.6 mm · 600 × 1500 mm",21.80,"kg",1,5,7,"in",0,"stain",{rho:8000,sy:220,su:530,E:193,hb:"79 HRB",K:16.3,a:16.0,tmax:870,corr:5,food:1,uv:5,recy:90,ee:66,kic:190,el:45},["thin gauge","heat transfer"],"Thin-gauge annealed strip for press-formed plate heat exchangers. The thermal conductivity of stainless is poor — 16 W/m·K against 400 for copper — so plate exchangers compensate with very thin walls and turbulent corrugations.","Deep-drawn or hydroformed into a chevron pattern, then either gasketed or vacuum-brazed into a stack."],
["BSA-2205-PL","Duplex","2205 duplex stainless plate","6 mm · 1220 × 2440 mm",24.60,"kg",1,10,7,"in",0,"duplex",{rho:7800,sy:450,su:655,E:200,hb:"260 HB",K:19,a:13.7,tmax:300,corr:5,food:1,uv:5,recy:88,ee:68,kic:150,el:25},["high strength","SCC resistant"],"A roughly 50/50 ferrite-austenite microstructure that doubles the yield strength of 316L while resisting chloride stress-corrosion cracking, which austenitics do not. You can often specify half the wall thickness — recovering much of the price premium.","Cut and weld with matched 2209 filler and controlled heat input; too fast a cool leaves excess ferrite and destroys toughness."],
["BSA-904L","Duplex","904L super-austenitic plate","4 mm · 1000 × 2000 mm",41.50,"kg",1,5,14,"oo",0,"duplex",{rho:8000,sy:220,su:490,E:190,hb:"70 HRB",K:11.5,a:15.3,tmax:400,corr:5,food:1,uv:5,recy:85,ee:80,kic:180,el:35},["extreme corrosion","acid service"],"High nickel, high molybdenum and a copper addition give resistance to hot sulphuric and organic acids that defeats 316L. Reserve it for digester liquor, silage effluent and similar aggressive service — it is nearly three times the price of 316L.","Weld with matching or over-alloyed filler. Requires strict cleanliness — iron contamination from carbon-steel tooling will initiate pitting."],
["BSA-430-SH","Austenitic 300-series","AISI 430 ferritic stainless sheet","1.2 mm · 1220 × 2440 mm",7.90,"kg",1,10,3,"in",0,"stain",{rho:7700,sy:275,su:450,E:200,hb:"82 HRB",K:23.9,a:10.4,tmax:815,corr:3,food:1,uv:4,recy:92,ee:42,kic:60,el:22},["low cost","magnetic","low CTE"],"Chromium-only ferritic stainless with no nickel — which is why it is 30 % cheaper than 304 and why its price is far more stable. It is magnetic, less corrosion resistant and much less formable, but for dry or mildly wet service it is excellent value.","Shear and brake form with generous radii. Weldable but grain growth in the HAZ embrittles thick sections."],
["BSA-410-BAR","Austenitic 300-series","AISI 410 martensitic stainless round bar","Ø25 mm · 3.66 m",9.60,"kg",1,3,4,"in",5.50,"stain",{rho:7800,sy:275,su:515,E:200,hb:"95 HRB",K:24.9,a:9.9,tmax:650,corr:3,food:1,uv:4,recy:92,ee:45,kic:50,el:20},["hardenable","cutlery"],"The only stainless family that hardens by quenching — it reaches 45 HRC and holds an edge, which is why food-processing knives and pump shafts use it. Corrosion resistance is markedly lower than 304 and drops further as hardness rises.","Machine soft, harden and temper (MFW-HT-QT), then grind and passivate. Never temper in the 400–550 °C range — it embrittles."],
["BSA-17-4PH","Duplex","17-4 PH precipitation-hardening stainless bar","Ø40 mm · 3.0 m",31.80,"kg",1,3,7,"in",6.50,"duplex",{rho:7800,sy:1170,su:1310,E:196,hb:"40 HRC",K:18.3,a:10.8,tmax:315,corr:4,food:1,uv:5,recy:85,ee:75,kic:60,el:10},["very high strength","corrosion resistant"],"Copper precipitates give this alloy the strength of hardened 4140 while keeping stainless-level corrosion resistance. The ageing treatment runs at only 480–620 °C, so distortion is minimal — machine to near-final size, then age.","Machine in condition A, age to H900–H1150 depending on the strength-toughness balance you need. Growth during ageing is under 0.1 %."],
["BSA-BOLT-M10","Fasteners","A4-80 (316) stainless hex bolt","M10 × 50 mm, DIN 933",2.35,"ea",0.043,10,2,"in",0,"stain",{rho:8000,sy:600,su:800,E:193,hb:"250 HB",K:16.3,a:16.0,tmax:600,corr:5,food:1,uv:5,recy:90,ee:70,kic:150,el:20},["marine","food grade"],"A4 is the marine grade — 316 chemistry. Use it wherever a galvanised bolt would corrode, and never mix it with plain steel in a wet joint, or the steel becomes the anode and dissolves.","Torque to a reduced value versus steel and always use an anti-seize compound: austenitic stainless galls catastrophically under thread friction."],
["BSA-NUT-M10","Fasteners","A4-70 stainless nyloc nut","M10, DIN 985",0.78,"ea",0.011,10,2,"in",0,"stain",{rho:8000,sy:450,su:700,E:193,hb:"210 HB",K:16.3,a:16.0,tmax:120,corr:5,food:0,uv:4,recy:88,ee:70,kic:150,el:20},["vibration","reusable"],"Nylon insert resists vibration loosening but caps the service temperature at 120 °C — it will not survive a hot clean-in-place cycle. Use an all-metal prevailing-torque nut on anything steam-cleaned.","Hand start, then torque. The nylon insert is good for roughly five re-uses before its locking prevailing torque falls below spec."],
["BSA-GASK-38","Sanitary tube & fittings","EPDM sanitary gasket, FDA 21 CFR 177.2600","Tri-clamp 38 mm",3.90,"ea",0.010,5,2,"in",0,"epdm",{rho:1250,sy:0,su:14,E:0.01,hb:"70 Shore A",K:0.25,a:160,tmax:150,corr:4,food:1,uv:4,recy:10,ee:65,kic:0,el:400},["FDA","steam"],"EPDM handles hot water, steam and caustic CIP chemicals but swells badly in fats and oils. For high-fat dairy streams specify a fluoroelastomer or PTFE-envelope gasket instead — a classic elastomer-selection trap.","Install dry and centred in the clamp groove. Replace on a schedule, not on failure — a compressed-set gasket is a crevice and a contamination risk."],
["BSA-CLAMP-38","Sanitary tube & fittings","Single-pin tri-clamp, 304 stainless","38 mm (1.5 in) ferrule",6.80,"ea",0.120,5,2,"in",0,"stain",{rho:8000,sy:215,su:505,E:193,hb:"70 HRB",K:16.2,a:17.3,tmax:600,corr:4,food:1,uv:5,recy:90,ee:60,kic:200,el:40},["tool-free","cleanable"],"Tool-free joints are what make a dairy circuit strippable for inspection. The clamp itself is not product contact, so 304 is acceptable even on a 316L line.","Hand tighten only. Over-torquing extrudes the gasket into the bore and creates the exact crevice the design is meant to eliminate."],
["BSA-FILL-316L","Fasteners","316L GTAW filler rod","Ø2.4 mm · 4.5 kg tube",38.50,"kg",1,4.5,2,"in",0,"stain",{rho:8000,sy:350,su:550,E:193,hb:"85 HRB",K:16.3,a:16.0,tmax:870,corr:5,food:1,uv:5,recy:90,ee:70,kic:180,el:35},["consumable","matched"],"Matched-composition filler for 316L. Filler is always chosen to match or slightly over-alloy the base metal — under-alloyed weld metal becomes the anode and corrodes preferentially in service.","Store dry. Purge the joint root with argon: unpurged stainless weld roots form a chromium-depleted sugar layer that fails in months."],
["BSA-2205-TUBE","Duplex","2205 duplex tube","Ø48.3 × 2.1 mm · 6.1 m",86.40,"m",1.77,1,10,"lo",14.00,"duplex",{rho:7800,sy:450,su:655,E:200,hb:"260 HB",K:19,a:13.7,tmax:300,corr:5,food:1,uv:5,recy:88,ee:70,kic:150,el:25},["high pressure","SCC resistant"],"Duplex tube for high-pressure chloride-bearing service — digester recirculation loops, brine lines, effluent handling. The higher yield strength lets you hold the same pressure with a thinner wall than 316L.","Orbital weldable with 2209 filler and strict heat-input control. Solution anneal after severe cold forming."],
["BSA-NI200-SH","Nickel & titanium","Nickel 200 sheet, commercially pure","1.6 mm · 610 × 1220 mm",58.90,"kg",1,3,14,"oo",0,"nickel",{rho:8890,sy:150,su:462,E:207,hb:"110 HB",K:70.2,a:13.3,tmax:315,corr:5,food:1,uv:5,recy:80,ee:135,kic:150,el:47},["caustic","high conductivity"],"Commercially pure nickel is the standard for hot caustic service — sodium hydroxide CIP at concentration will attack even 316L over time. Also has four times the thermal conductivity of stainless.","GTAW weld with Ni-filler under strict cleanliness — sulphur from fingerprints or cutting fluid causes hot cracking."],
["BSA-TI-GR2","Nickel & titanium","Titanium Grade 2 sheet, commercially pure","1.6 mm · 610 × 1220 mm",96.00,"kg",1,2,21,"oo",0,"tita",{rho:4510,sy:275,su:345,E:105,hb:"160 HB",K:16.4,a:8.6,tmax:425,corr:5,food:1,uv:5,recy:75,ee:590,kic:66,el:20},["seawater","biocompatible","light"],"Immune to chloride pitting and crevice corrosion at ambient temperature, at 56 % the density of stainless. The catch is embodied energy — roughly 590 MJ/kg, nearly ten times stainless — so life-cycle arguments cut both ways.","Must be welded in an inert chamber or with full trailing-shield argon coverage; titanium absorbs oxygen and nitrogen above 500 °C and embrittles."]
],
CPP:[
["CPP-HDPE-25","HDPE pipe","PE4710 HDPE pipe, IPS SDR11","25 mm (1 in) NPS · 200 psi",4.59,"m",0.277,3,3,"in",0.70,"hdpe",{rho:955,sy:23,su:31,E:0.9,hb:"64 Shore D",K:0.45,a:200,tmax:60,corr:5,food:1,uv:3,recy:85,ee:80,kic:3.5,el:800},["fusible","flexible","potable"],"High-density polyethylene lateral. It is fusion-welded rather than glued, which gives a joint stronger than the pipe itself — the reason HDPE dominates buried irrigation where root intrusion and joint pull-out kill PVC systems.","Butt fusion or electrofusion (CPP-HDPE-FUSE). Never solvent cement — nothing bonds to polyethylene."],
["CPP-HDPE-50","HDPE pipe","PE4710 HDPE pipe, IPS SDR11","50 mm (2 in) NPS · 200 psi",13.60,"m",0.900,3,3,"in",0.70,"hdpe",{rho:955,sy:23,su:31,E:0.9,hb:"64 Shore D",K:0.45,a:200,tmax:60,corr:5,food:1,uv:3,recy:85,ee:80,kic:3.5,el:800},["fusible","UV stabilised","potable"],"The standard sub-main size for field irrigation. Carbon-black loading at 2–2.5 % gives genuine long-term UV stability, unlike white PVC which chalks and embrittles in sunlight within a few seasons.","Butt-fused with a hydraulic fusion machine; the bead must be rolled back and continuous around the full circumference to pass inspection."],
["CPP-HDPE-100","HDPE pipe","PE4710 HDPE pipe, IPS SDR11","100 mm (4 in) NPS · 200 psi",32.20,"m",3.240,3,4,"in",2.50,"hdpe",{rho:955,sy:23,su:31,E:0.9,hb:"64 Shore D",K:0.45,a:200,tmax:60,corr:5,food:1,uv:3,recy:85,ee:80,kic:3.5,el:800},["main line","fusible"],"Main-line size. Note that the price per metre rises faster than the diameter because wall thickness scales with diameter at constant SDR — doubling the bore roughly quadruples the material.","Butt fusion; requires a trench with a bedding layer of sand or screened material to prevent point loading."],
["CPP-HDPE-200","HDPE pipe","PE4710 HDPE pipe, IPS SDR11","200 mm (8 in) NPS · 200 psi",108.00,"m",11.890,3,7,"lo",9.00,"hdpe",{rho:955,sy:23,su:31,E:0.9,hb:"64 Shore D",K:0.45,a:200,tmax:60,corr:5,food:1,uv:3,recy:85,ee:80,kic:3.5,el:800},["trunk main","heavy"],"Trunk-main size for farm distribution or digester gas headers. At nearly 12 kg per metre it needs mechanical handling and a proper thrust-restraint design.","Butt fusion with a large-diameter machine, or flanged with a stub end and backing ring where dismantling is required."],
["CPP-HDPE-COIL","HDPE pipe","PE4710 HDPE coil, IPS SDR11","25 mm × 150 m coil",640.00,"ea",41.60,1,5,"in",0,"hdpe",{rho:955,sy:23,su:31,E:0.9,hb:"64 Shore D",K:0.45,a:200,tmax:60,corr:5,food:1,uv:3,recy:85,ee:80,kic:3.5,el:800},["coil","no joints"],"Buying in coil eliminates joints — the single biggest source of leaks and the main labour cost in a drip system. Compare the effective price per metre against straight lengths plus fittings before you decide.","Uncoil in warm weather and allow it to relax before backfilling, or thermal contraction will pull the fittings apart in the first cold night."],
["CPP-PVC-S40-50","PVC & CPVC","PVC Schedule 40 pressure pipe","50 mm (2 in) · 280 psi @ 23 °C",5.80,"m",0.920,3,2,"in",0.60,"pvcw",{rho:1400,sy:45,su:52,E:3.0,hb:"80 Shore D",K:0.19,a:70,tmax:60,corr:4,food:1,uv:1,recy:35,ee:70,kic:2.5,el:60},["low cost","rigid","solvent weld"],"The cheapest pressure pipe on the market and easily the stiffest polymer option — over three times the modulus of HDPE. Its weaknesses are UV degradation and brittle fracture in cold weather, both fatal above ground in a Québec winter.","Solvent-cement socket joints. The joint is a chemical weld, not a glue — it needs primer, a full wet coat and a quarter-turn on assembly."],
["CPP-PVC-S40-100","PVC & CPVC","PVC Schedule 40 pressure pipe","100 mm (4 in) · 220 psi @ 23 °C",16.10,"m",2.750,3,2,"in",1.50,"pvcw",{rho:1400,sy:45,su:52,E:3.0,hb:"80 Shore D",K:0.19,a:70,tmax:60,corr:4,food:1,uv:1,recy:35,ee:70,kic:2.5,el:60},["low cost","rigid"],"Main-line PVC at roughly half the price of the equivalent HDPE. That saving is real, but so is the higher failure rate at joints when the ground moves — weigh installed cost, not material cost.","Solvent-cement with thrust blocks at every change of direction; PVC joints carry no tensile load."],
["CPP-PVC-S80-50","PVC & CPVC","PVC Schedule 80 pressure pipe","50 mm (2 in) · 400 psi @ 23 °C",9.40,"m",1.260,3,3,"in",0.60,"pvcg",{rho:1400,sy:45,su:52,E:3.0,hb:"80 Shore D",K:0.19,a:70,tmax:60,corr:4,food:1,uv:2,recy:35,ee:70,kic:2.5,el:60},["high pressure","threadable"],"Thicker wall for higher pressure and the only PVC schedule that may be threaded. Note the pressure rating is quoted at 23 °C — at 50 °C you must de-rate it to about 50 % of the printed value.","Solvent weld or thread. Threading removes half the wall, so a threaded Sch 80 joint has roughly the pressure rating of plain Sch 40."],
["CPP-CPVC-50","PVC & CPVC","CPVC Schedule 80 pipe","50 mm (2 in) · 200 psi @ 82 °C",16.80,"m",1.550,3,5,"in",1.00,"cpvc",{rho:1550,sy:52,su:55,E:2.9,hb:"85 Shore D",K:0.14,a:62,tmax:93,corr:4,food:1,uv:2,recy:15,ee:75,kic:2.0,el:40},["hot water","chemical"],"Chlorinating the PVC backbone lifts the service temperature from 60 °C to 93 °C, which is what makes CPVC viable for hot cleaning circuits and solar-thermal loops. It costs roughly three times plain Sch 40.","Solvent cement with CPVC-specific one-step cement; PVC cement will not develop full strength on CPVC."],
["CPP-PEX-25","PVC & CPVC","PEX-a cross-linked polyethylene tube","25 mm · 160 psi @ 23 °C",6.20,"m",0.220,3,3,"in",0,"pex",{rho:938,sy:19,su:26,E:0.6,hb:"60 Shore D",K:0.38,a:150,tmax:93,corr:5,food:1,uv:1,recy:5,ee:82,kic:3.0,el:400},["flexible","freeze tolerant"],"Cross-linking gives polyethylene a memory and a much higher service temperature. Its real advantage in cold climates is that it expands rather than bursts on freezing — the reason it dominates in-floor heating in greenhouses.","Expansion-ring or crimp fittings. Cross-linked material cannot be fusion welded or recycled by melting, which is its main sustainability liability."],
["CPP-PP-SH12","Sheet stock","Polypropylene homopolymer sheet","12 mm · 1220 × 2440 mm",348.00,"ea",32.40,1,5,"in",0,"pp",{rho:905,sy:33,su:38,E:1.5,hb:"75 Shore D",K:0.22,a:100,tmax:100,corr:5,food:1,uv:1,recy:70,ee:78,kic:3.0,el:150},["chemical resistant","weldable","light"],"The lightest common engineering polymer at 0.905 g/cm³ — it floats. Outstanding resistance to acids, alkalis and most fertiliser salts, which makes it the natural liner for a corrosive hopper.","Hot-gas or extrusion welded with PP rod; CNC routed. Cannot be solvent cemented — no solvent attacks it, which is precisely the point."],
["CPP-UHMW-SH12","Sheet stock","UHMW-PE sheet, virgin","12 mm · 1220 × 2440 mm",612.00,"ea",33.60,1,5,"in",0,"uhmw",{rho:940,sy:21,su:40,E:0.7,hb:"64 Shore D",K:0.42,a:200,tmax:80,corr:5,food:1,uv:2,recy:40,ee:90,kic:4.5,el:350},["low friction","abrasion resistant","food grade"],"Ultra-high molecular weight polyethylene has the lowest coefficient of friction of any commercial solid apart from PTFE, and it outwears carbon steel in sliding abrasion against grain and wood chips. That is why silo and hopper liners are made from it.","Routed or sawn; fastened with countersunk bolts and oversized holes to allow for its very large thermal movement — 200 µm/m·K, sixteen times steel."],
["CPP-UHMW-BAR","Sheet stock","UHMW-PE round bar","Ø50 mm · 3.0 m",34.80,"m",1.850,1,5,"in",4.00,"uhmw",{rho:940,sy:21,su:40,E:0.7,hb:"64 Shore D",K:0.42,a:200,tmax:80,corr:5,food:1,uv:2,recy:40,ee:90,kic:4.5,el:350},["bearing","food grade"],"Bar stock for sprockets, guide rollers and dry-running bushings in wash-down environments where a greased bronze bearing would be a contamination risk.","Turn and mill with sharp positive-rake tooling and no coolant. Expect the part to grow slightly after machining as residual stress relaxes."],
["CPP-PC-TW8","Glazing","Twin-wall polycarbonate glazing, UV-coated","8 mm · 1220 × 2440 mm",82.50,"ea",4.47,1,4,"in",0,"pc",{rho:1200,sy:62,su:66,E:2.4,hb:"M70",K:0.21,a:65,tmax:115,corr:4,food:0,uv:5,recy:30,ee:110,kic:3.0,el:110},["insulating","light transmitting","impact"],"The greenhouse glazing benchmark: about 80 % light transmission, a U-value near 3.3 W/m²·K thanks to the trapped air cell, and 200 times the impact resistance of glass. The co-extruded UV layer is the only thing standing between it and yellowing — it must face outward.","Cut with a fine-tooth blade, seal the top flute with solid tape and the bottom with vented tape so condensate drains. Allow 3 mm per metre of thermal expansion in the glazing bar."],
["CPP-PC-TW16","Glazing","Triple-wall polycarbonate glazing, UV-coated","16 mm · 1220 × 2440 mm",146.00,"ea",7.90,1,5,"in",0,"pc",{rho:1200,sy:62,su:66,E:2.4,hb:"M70",K:0.21,a:65,tmax:115,corr:4,food:0,uv:5,recy:30,ee:110,kic:3.0,el:110},["high insulation","cold climate"],"Three walls and 16 mm of depth drop the U-value to about 2.3 W/m²·K — roughly a 30 % heating-energy saving over 8 mm twin-wall, at 77 % more cost and about 6 % less light. That trade sits at the heart of any cold-climate greenhouse brief.","As for twin-wall, but the greater depth needs a wider glazing bar and heavier purlin spacing."],
["CPP-PC-SOL6","Glazing","Solid polycarbonate sheet, UV-coated both faces","6 mm · 1220 × 2440 mm",268.00,"ea",21.50,1,5,"in",0,"pcsolid",{rho:1200,sy:62,su:66,E:2.4,hb:"M70",K:0.21,a:65,tmax:115,corr:4,food:0,uv:5,recy:30,ee:110,kic:3.5,el:110},["highest clarity","vandal proof"],"Optically clear, essentially unbreakable, and a poor insulator — a single skin has a U-value near 5.4 W/m²·K. Use it for end walls, doors and anywhere clarity or impact matters more than heat loss.","Cold-formable to a generous radius, routed and drilled with oversized holes. Never clean with ammonia — it crazes."],
["CPP-ACRYL-6","Glazing","Cast acrylic (PMMA) sheet","6 mm · 1220 × 2440 mm",196.00,"ea",21.30,1,4,"in",0,"acryl",{rho:1190,sy:70,su:72,E:3.2,hb:"M95",K:0.19,a:70,tmax:80,corr:4,food:0,uv:5,recy:40,ee:100,kic:1.3,el:5},["best clarity","weatherable","brittle"],"Higher light transmission than polycarbonate at 92 %, and it never yellows. The price is brittleness — fracture toughness is a quarter of polycarbonate, so a hailstone that bounces off PC will punch straight through acrylic.","Laser cut cleanly, flame polish edges, solvent cement with dichloromethane. Drill with a modified zero-rake bit or it will crack."],
["CPP-PETG-3","Glazing","PETG sheet","3 mm · 1220 × 2440 mm",124.00,"ea",11.40,1,4,"in",0,"acryl",{rho:1270,sy:50,su:53,E:2.1,hb:"M70",K:0.20,a:68,tmax:70,corr:4,food:1,uv:2,recy:75,ee:84,kic:3.5,el:120},["food grade","thermoformable"],"The easiest of the clear polymers to thermoform and the only one on this page that is food-contact approved and widely recycled. Poor UV resistance without a coating limits it to indoor and short-term outdoor use.","Cold bend, thermoform at 120–140 °C, solvent cement. Needs no drying before forming, unlike polycarbonate."],
["CPP-FILM-6","Geomembrane & film","UV-stabilised greenhouse polyethylene film","6 mil (150 µm) · 7.3 × 30 m roll",385.00,"ea",30.20,1,4,"in",0,"film",{rho:920,sy:12,su:22,E:0.25,hb:"50 Shore D",K:0.33,a:200,tmax:60,corr:5,food:0,uv:4,recy:50,ee:80,kic:2.0,el:600},["cheapest glazing","4-year"],"By far the cheapest way to enclose a square metre — about $1.75/m² against $28/m² for twin-wall polycarbonate. The catch is a four-year replacement cycle and much poorer insulation, so the life-cycle comparison is far closer than the sticker price suggests.","Stretched over hoops and held in extruded aluminium lock channels with a wiggle-wire spring. Double-layer with an inflation blower for a large jump in R-value."],
["CPP-GEOM-15","Geomembrane & film","HDPE geomembrane liner, textured","1.5 mm · 7 m wide roll",9.80,"m2",1.430,20,7,"in",0,"hdpe",{rho:945,sy:17,su:27,E:0.7,hb:"60 Shore D",K:0.40,a:200,tmax:60,corr:5,food:0,uv:5,recy:60,ee:80,kic:3.0,el:700},["containment","chemical"],"Containment liner for lagoons, digester basins and leachate ponds. Chemically inert to the organic acids and ammonia found in manure and silage effluent, which corrode concrete and mild steel.","Wedge-welded with a dual-track hot wedge and air-channel tested for leaks; anchored in a perimeter trench."],
["CPP-EPDM-114","Geomembrane & film","EPDM membrane liner","1.14 mm (45 mil) · 6 m wide",12.40,"m2",1.370,20,5,"in",0,"epdm",{rho:1200,sy:9,su:9,E:0.005,hb:"60 Shore A",K:0.25,a:160,tmax:120,corr:4,food:0,uv:5,recy:5,ee:65,kic:0,el:300},["elastic","conformable"],"Where HDPE geomembrane is stiff and must be welded, EPDM stretches 300 % and conforms to irregular substrates — useful for retrofitting an existing tank or covering a gas holder that changes volume.","Seamed with butyl splice tape or contact adhesive; no heat required, which makes field repair simple."],
["CPP-PTFE-3","Sheet stock","PTFE sheet, virgin","3 mm · 300 × 300 mm",88.00,"ea",0.594,1,3,"in",0,"ptfe",{rho:2200,sy:12,su:25,E:0.5,hb:"55 Shore D",K:0.25,a:130,tmax:260,corr:5,food:1,uv:5,recy:0,ee:120,kic:3.0,el:300},["inert","non-stick","high temp"],"Chemically inert to essentially everything, food-contact approved, stable from −200 °C to 260 °C, and the lowest friction of any solid. It also creeps badly under sustained load and cannot be welded or bonded without surface etching.","Machined only. Always use a filled grade (glass or bronze) if the part carries sustained compressive load, or it will cold-flow out of the joint."],
["CPP-NYL66-50","Sheet stock","Nylon 6/6 round bar, extruded","Ø50 mm · 1.0 m",58.40,"m",2.240,1,4,"in",4.00,"nylon",{rho:1140,sy:82,su:83,E:3.0,hb:"R120",K:0.25,a:90,tmax:105,corr:3,food:1,uv:2,recy:30,ee:120,kic:3.5,el:50},["tough","gears","bearing"],"The strongest and stiffest of the common machinable polymers, with good fatigue resistance — the standard material for polymer gears and cam followers. Its one serious weakness is moisture: it absorbs up to 2.5 % water, growing dimensionally and losing a third of its stiffness.","Machine dry, then condition in water to stabilise dimensions before final inspection. Specify nylon 12 or acetal if dimensional stability in a wet environment is critical."],
["CPP-PVCFIT-T50","PVC & CPVC","PVC Schedule 40 socket tee","50 mm (2 in)",4.30,"ea",0.180,5,2,"in",0,"pvcw",{rho:1400,sy:45,su:52,E:3.0,hb:"80 Shore D",K:0.19,a:70,tmax:60,corr:4,food:1,uv:1,recy:35,ee:70,kic:2.5,el:60},["fitting","solvent weld"],"Fittings are where a piping cost estimate is won or lost. A drip system with a lateral every 1.5 m needs hundreds of these, and their combined cost can exceed the pipe itself.","Prime and solvent cement. Count every fitting in your bill of materials — students routinely price pipe and forget the fittings."],
["CPP-HDPE-FUSE","HDPE pipe","HDPE electrofusion coupler","50 mm (2 in) IPS",22.50,"ea",0.210,5,4,"in",0,"hdpe",{rho:955,sy:23,su:31,E:0.9,hb:"64 Shore D",K:0.45,a:200,tmax:60,corr:5,food:1,uv:3,recy:80,ee:85,kic:3.5,el:800},["fusion","leak proof"],"Five times the price of the equivalent PVC fitting — and the direct reason HDPE systems cost more to install. What you buy is a joint stronger than the pipe wall, which is why municipal and long-life agricultural mains use it.","Scrape the pipe surface to remove the oxidised skin, clamp in an alignment jig, and run the fusion controller. Joint integrity depends entirely on that scraping step."]
],
TFC:[
["TFC-CSM-450","Glass reinforcement","E-glass chopped strand mat, 450 g/m²","1.27 m wide roll",4.95,"m2",0.450,2,3,"in",0,"csm",{rho:2560,sy:0,su:100,E:7,hb:"n/a",K:1.0,a:5.0,tmax:550,corr:4,food:0,uv:4,recy:15,ee:48,kic:10,el:2},["low cost","isotropic","hand layup"],"Randomly oriented short fibres bound with a styrene-soluble binder. Properties are equal in all directions but low — a CSM laminate reaches only about 30 % fibre volume fraction. It is the cheapest way to build thickness and is what most FRP tanks are made of.","Hand layup with polyester or vinyl ester resin. Resin uptake is roughly 2.5 times the fabric mass, so budget 1.1 kg of resin per square metre of 450 g mat."],
["TFC-WR-600","Glass reinforcement","E-glass woven roving, 600 g/m²","1.27 m wide roll",6.40,"m2",0.600,2,3,"in",0,"glassf",{rho:2560,sy:0,su:340,E:17,hb:"n/a",K:1.0,a:5.0,tmax:550,corr:4,food:0,uv:4,recy:15,ee:48,kic:15,el:2},["structural","bidirectional"],"Coarse bidirectional weave that builds structural laminate fast. Alternating woven roving with chopped strand mat is the classic tank-and-hull schedule — the mat prevents the roving layers from delaminating.","Hand layup or vacuum infusion. Achieves roughly 45 % fibre volume fraction under vacuum, against 30 % by hand."],
["TFC-EG-200","Glass reinforcement","E-glass plain-weave cloth, 200 g/m²","1.27 m wide roll",8.80,"m2",0.200,2,3,"in",0,"glassf",{rho:2560,sy:0,su:340,E:17,hb:"n/a",K:1.0,a:5.0,tmax:550,corr:4,food:0,uv:4,recy:15,ee:48,kic:15,el:2},["fine finish","surface ply"],"Fine cloth for surface plies and detail work. Its main structural role is as a barrier ply behind the gelcoat, preventing print-through of the coarse reinforcement underneath.","Hand layup. Wet out fully — dry glass in a surface ply wicks water and blisters."],
["TFC-FLAX-300","Natural fibre","Flax fibre 2×2 twill, 300 g/m²","1.0 m wide roll",28.50,"m2",0.300,2,7,"in",0,"flax",{rho:1450,sy:0,su:500,E:50,hb:"n/a",K:0.07,a:15,tmax:180,corr:2,food:0,uv:2,recy:90,ee:9.5,kic:8,el:2.5},["bio-based","damping","low energy"],"Québec-grown flax with specific stiffness comparable to E-glass at 57 % the density and a fifth of the embodied energy. It also damps vibration far better than glass. The trade-offs are moisture absorption, batch-to-batch variability and a 180 °C ceiling.","Vacuum infusion with a bio-epoxy. Dry the fabric at 80 °C for two hours immediately before layup — absorbed moisture turns to steam and creates voids."],
["TFC-HEMP-400","Natural fibre","Hemp fibre non-woven mat, 400 g/m²","1.5 m wide roll",19.80,"m2",0.400,2,7,"in",0,"hemp",{rho:1480,sy:0,su:380,E:35,hb:"n/a",K:0.07,a:15,tmax:180,corr:2,food:0,uv:2,recy:90,ee:8.0,kic:7,el:2},["bio-based","agri-waste","insulating"],"Non-woven hemp from processing residue — the definition of an agricultural waste stream turned into a structural material. Lower properties than woven flax but a third of the price and even lower embodied energy.","Compression moulding or infusion. Best suited to semi-structural panels, insulation cores and non-critical enclosures."],
["TFC-JUTE-350","Natural fibre","Jute woven fabric, 350 g/m²","1.0 m wide roll",11.40,"m2",0.350,2,5,"in",0,"jute",{rho:1460,sy:0,su:400,E:25,hb:"n/a",K:0.07,a:15,tmax:170,corr:2,food:0,uv:1,recy:95,ee:5.5,kic:6,el:1.8},["lowest cost bio","compostable"],"The cheapest natural reinforcement and the lowest embodied energy of anything in this catalogue at about 5.5 MJ/kg. Properties are modest and moisture sensitivity is high, but for a non-structural biocomposite panel core it is hard to beat on a life-cycle basis.","Compression mould with a bio-resin. Must be sealed against moisture or the panel swells and delaminates within a season."],
["TFC-CF-200","Glass reinforcement","Carbon fibre 2×2 twill, 200 g/m²","1.27 m wide roll",54.00,"m2",0.200,2,5,"in",0,"carbonf",{rho:1760,sy:0,su:3500,E:230,hb:"n/a",K:10,a:-0.5,tmax:400,corr:5,food:0,uv:5,recy:5,ee:280,kic:20,el:1.5},["highest stiffness","expensive"],"Ten times the price of E-glass for roughly thirteen times the fibre modulus. Include it in your Pugh chart as the high-performance benchmark, then be honest about whether the application can justify the cost and the 280 MJ/kg embodied energy.","Vacuum infusion or prepreg autoclave cure. Never bolt carbon directly to aluminium or steel without an insulating layer — the galvanic couple is severe."],
["TFC-BAS-300","Glass reinforcement","Basalt fibre fabric, 300 g/m²","1.0 m wide roll",22.60,"m2",0.300,2,7,"lo",0,"basalt",{rho:2700,sy:0,su:2900,E:89,hb:"n/a",K:0.9,a:8.0,tmax:700,corr:5,food:0,uv:5,recy:20,ee:20,kic:16,el:3.1},["high temp","natural mineral"],"Spun from melted volcanic rock with no additives. Stiffer and far more heat- and alkali-resistant than E-glass, with under half the embodied energy of carbon. A genuinely interesting middle option that most students never consider.","Same processing as E-glass. Its alkali resistance makes it the reinforcement of choice for concrete and lime-matrix composites."],
["TFC-POLY-GP","Resins","General-purpose orthophthalic polyester resin","20 L pail, MEKP catalysed",12.80,"L",1.10,4,3,"in",0,"resin",{rho:1200,sy:55,su:65,E:3.5,hb:"M90",K:0.19,a:100,tmax:80,corr:3,food:0,uv:2,recy:0,ee:63,kic:0.6,el:2},["cheapest resin","fast cure"],"The cheapest laminating resin and the reason FRP is affordable. It shrinks 7–9 % on cure, is attacked by alkalis and hot water, and has poor fatigue resistance — but for a static, ambient-temperature panel it is entirely adequate.","Catalyse at 1–2 % MEKP by volume and use within the pot life. Post-cure at 60 °C to reach full properties; an uncured laminate has roughly half its design strength."],
["TFC-VE-700","Resins","Vinyl ester resin, corrosion grade","20 L pail",28.40,"L",1.10,4,4,"in",0,"resin",{rho:1150,sy:80,su:85,E:3.4,hb:"M95",K:0.18,a:65,tmax:120,corr:5,food:0,uv:3,recy:0,ee:70,kic:1.2,el:5},["chemical resistant","tough"],"An epoxy backbone with polyester end groups — it processes like polyester but resists acids, alkalis and hot water like an epoxy. This is the standard matrix for chemical tanks and digester internals, at just over double the price of general-purpose polyester.","Same catalysis and processing as polyester. Requires a resin-rich corrosion barrier ply at any chemically exposed surface."],
["TFC-EP-635","Resins","Laminating epoxy resin system, 2:1","15 L kit (10 L resin + 5 L hardener)",24.60,"L",1.10,4,4,"in",0,"resin",{rho:1150,sy:70,su:75,E:3.2,hb:"M85",K:0.20,a:60,tmax:100,corr:5,food:0,uv:2,recy:0,ee:110,kic:1.0,el:4},["best adhesion","low shrink"],"Cures with under 2 % shrinkage and bonds to almost anything, which is why it is the only sensible matrix for natural fibres — polyester shrinkage tears flax and hemp bundles apart during cure.","Mix strictly by weight, not volume, and control the exotherm in thick sections. Post-cure to reach the stated glass transition temperature."],
["TFC-BIO-56","Resins","Bio-based epoxy, 56 % bio-carbon content","15 L kit",34.80,"L",1.10,4,7,"in",0,"bioresin",{rho:1140,sy:65,su:70,E:3.0,hb:"M80",K:0.20,a:65,tmax:90,corr:4,food:0,uv:2,recy:0,ee:52,kic:1.1,el:5},["bio-based","lower carbon"],"Partly derived from plant oils and lignin, cutting embodied energy from about 110 to 52 MJ/kg — a genuine halving. Mechanical properties are roughly 10 % below petroleum epoxy, and the price is 41 % higher, so the case rests on the life-cycle argument.","Identical processing to conventional epoxy but with a slightly longer cure. Pair it with flax or hemp for a fully bio-based laminate."],
["TFC-FURAN","Resins","Furan bio-resin, agricultural-residue derived","20 L pail",29.20,"L",1.20,4,10,"lo",0,"bioresin",{rho:1250,sy:45,su:50,E:4.5,hb:"M100",K:0.22,a:50,tmax:180,corr:5,food:0,uv:3,recy:0,ee:35,kic:0.5,el:1},["highest bio content","fire resistant"],"Made from furfuryl alcohol derived from corn cobs and bagasse — a true agricultural-waste-derived thermoset. It is stiffer and far more fire- and chemical-resistant than epoxy, and also more brittle. Its natural char formation is a real asset in a fire-code argument.","Acid catalysed with a controlled exotherm. It cures dark brown and releases water during cure, so the layup must be vented."],
["TFC-FRP-PAN3","Pultruded & panel","FRP flat panel, isophthalic polyester/CSM","3 mm · 1220 × 2440 mm",184.00,"ea",16.10,1,5,"in",0,"frp",{rho:1800,sy:0,su:110,E:8,hb:"Barcol 45",K:0.25,a:25,tmax:80,corr:5,food:1,uv:3,recy:5,ee:60,kic:12,el:1.5},["corrosion proof","non-conductive"],"Ready-made glass-reinforced panel — no layup required. Completely immune to the fertiliser salts and manure acids that destroy galvanised steel, and electrically non-conductive, which matters near electrical service.","Cut with a diamond or carbide blade under dust extraction. Seal every cut edge with resin — an unsealed edge wicks water into the laminate."],
["TFC-FRP-GRT38","Pultruded & panel","Moulded FRP grating, vinyl ester","38 mm deep · 38 mm mesh",296.00,"m2",12.00,1,10,"in",0,"frpgrate",{rho:1800,sy:0,su:170,E:12,hb:"Barcol 50",K:0.25,a:25,tmax:100,corr:5,food:0,uv:4,recy:5,ee:65,kic:12,el:1.8},["non-slip","corrosion proof"],"Walkway and platform grating for chemically aggressive areas — digester decks, fertiliser plants, wash-down floors. Roughly triple the price of galvanised steel bar grating, and it will still be there when the steel has rusted through twice.","Cut with a diamond blade and coat cut ends with vinyl ester. Support spacing governs deflection — FRP is far less stiff than steel and deflects visibly."],
["TFC-FRP-TUBE50","Pultruded & panel","Pultruded FRP square tube, vinyl ester","50 × 50 × 6 mm · 6 m",38.90,"m",1.900,1,7,"in",8.00,"frp",{rho:1800,sy:0,su:207,E:17,hb:"Barcol 50",K:0.25,a:8.0,tmax:100,corr:5,food:0,uv:4,recy:5,ee:65,kic:12,el:1.5},["corrosion proof","light","non-conductive"],"Set this against the galvanised HSS and the aluminium tube of the same nominal size. It is lighter than aluminium, will never corrode, and is only a quarter as stiff as steel — so the frame will be deflection-governed, not strength-governed.","Cut with a diamond blade; join with bonded or bolted brackets. Pultrusions are strongly anisotropic — nearly all fibres run lengthwise, so transverse and bearing strength are low."],
["TFC-FRP-IB102","Pultruded & panel","Pultruded FRP wide-flange beam","102 × 51 mm · 6 m",64.50,"m",2.070,1,7,"lo",8.00,"frp",{rho:1800,sy:0,su:207,E:17,hb:"Barcol 50",K:0.25,a:8.0,tmax:100,corr:5,food:0,uv:4,recy:5,ee:65,kic:12,el:1.5},["structural","corrosion proof"],"Structural section for corrosive-environment framing. Design it to a deflection limit rather than a stress limit and check the flanges for local buckling — FRP sections buckle long before they yield.","Bolted connections with oversized washers to spread bearing load; never weld or hot-form."],
["TFC-GELCOAT","Resins","Isophthalic NPG gelcoat, white","20 L pail",26.40,"L",1.25,4,4,"in",0,"resin",{rho:1250,sy:50,su:55,E:3.5,hb:"Barcol 40",K:0.20,a:80,tmax:90,corr:4,food:0,uv:4,recy:0,ee:68,kic:0.5,el:2},["UV barrier","surface"],"The pigmented surface layer that gives an FRP part its weather resistance and finish. Without it the laminate's surface glass fibres wick moisture and the part blisters — the failure mode behind most cheap fibreglass tanks.","Sprayed or brushed into the mould at 0.5–0.6 mm and allowed to gel before the first laminate ply goes on. Too thick and it cracks; too thin and it never fully cures."],
["TFC-CORE-15","Core materials","Cross-linked PVC structural foam core","15 mm · 1220 × 2440 mm",46.80,"m2",1.200,2,7,"in",0,"foam",{rho:80,sy:1.2,su:2.2,E:0.09,hb:"n/a",K:0.031,a:40,tmax:70,corr:4,food:0,uv:1,recy:10,ee:100,kic:0.3,el:15},["sandwich core","insulating"],"A sandwich core does for a panel exactly what the web does for an I-beam: separating two thin skins by 15 mm raises bending stiffness by roughly two orders of magnitude for almost no mass. It also happens to insulate at 0.031 W/m·K.","Vacuum bagged between skins; score or perforate the core so resin can flow and lock the skins together."],
["TFC-BALSA-12","Core materials","End-grain balsa core","12 mm · 1220 × 610 mm",58.20,"m2",1.800,2,7,"in",0,"balsa",{rho:150,sy:9,su:12,E:3.7,hb:"n/a",K:0.055,a:35,tmax:120,corr:2,food:0,uv:1,recy:95,ee:4.0,kic:0.5,el:2},["natural core","high compression"],"End-grain balsa carries roughly eight times the compressive stress of PVC foam at twice the density, and its embodied energy is 4 MJ/kg against 100 for the foam. Its weakness is rot if water ever reaches it — every fastener penetration must be sealed.","Vacuum bagged with an epoxy or vinyl ester. Bore out and fill every through-fastener location with thickened resin before drilling."],
["TFC-STRAW-18","Pultruded & panel","Wheat-straw particle board, formaldehyde-free","18 mm · 1220 × 2440 mm",92.00,"ea",34.90,1,7,"in",0,"strawb",{rho:650,sy:0,su:16,E:2.8,hb:"n/a",K:0.09,a:8,tmax:100,corr:1,food:0,uv:1,recy:95,ee:6.5,kic:0.4,el:1},["agri-waste","carbon storing"],"Made from wheat straw that would otherwise be burnt or ploughed under, bonded with a formaldehyde-free MDI resin. It performs like a good particle board, stores biogenic carbon, and is directly relevant to any agricultural-waste panel brief.","Cut and machine like wood. Must be edge-sealed and kept out of standing water; it is not a structural sheathing on its own."],
["TFC-HEMPBLK","Core materials","Hemp-lime (hempcrete) block","300 × 300 × 150 mm",14.60,"ea",5.40,10,10,"in",0,"hempcr",{rho:400,sy:0,su:0.8,E:0.05,hb:"n/a",K:0.07,a:8,tmax:200,corr:2,food:0,uv:2,recy:100,ee:2.5,kic:0.1,el:1},["carbon negative","breathable","fire resistant"],"Hemp shiv bound in a lime matrix. It is not structural — it infills a timber or steel frame — but it is carbon-negative over its life, regulates humidity passively, and is non-combustible. Embodied energy of 2.5 MJ/kg is the lowest in this catalogue.","Laid in a lime mortar or cast in situ around a frame. Needs a breathable lime render, never a cement one, or trapped moisture will rot the frame."],
["TFC-SIP-50","Pultruded & panel","Flax/bio-epoxy structural insulated panel","50 mm core · 1220 × 2440 mm",118.00,"m2",7.00,2,14,"lo",0,"bioresin",{rho:140,sy:0,su:6,E:1.2,hb:"n/a",K:0.038,a:30,tmax:90,corr:3,food:0,uv:2,recy:60,ee:18,kic:0.6,el:2},["bio-composite","insulating","structural"],"A complete bio-composite building panel: flax/bio-epoxy skins over a bio-foam core, R-value around 3.5 per 25 mm. This is the closest product in the catalogue to what a sustainable-construction brief actually asks you to design.","Panels are splined and bonded at joints. Fire performance must be verified against the building code — bio-resins char rather than melt, which helps, but a tested assembly rating is still required."]
],
VHM:[
["VHM-M2-HSS","Tool steel","AISI M2 high-speed steel flat ground stock","6 × 50 mm · 500 mm",46.80,"kg",1,0.5,5,"in",0,"hss",{rho:8160,sy:2200,su:2400,E:220,hb:"64 HRC",K:24,a:11.2,tmax:600,corr:1,food:0,uv:2,recy:70,ee:52,kic:17,el:0},["red hardness","cutting edge"],"Tungsten-molybdenum high-speed steel keeps its 64 HRC hardness to about 600 °C — that red hardness is the whole point, and it is why sawmill and planer knives are made from it rather than plain carbon steel.","Grind to shape in the hardened condition with copious coolant; burning the edge draws the temper locally and it will fail there first."],
["VHM-D2-PL","Tool steel","AISI D2 cold-work tool steel plate","12 mm · 300 × 300 mm",22.40,"kg",1,3,5,"in",0,"toolst",{rho:7700,sy:1900,su:2100,E:210,hb:"60 HRC",K:20,a:10.4,tmax:425,corr:2,food:0,uv:2,recy:75,ee:44,kic:16,el:0},["abrasion resistant","dimensionally stable"],"Twelve percent chromium gives a huge volume of hard carbides — outstanding abrasion resistance and near-zero size change through heat treatment. That carbide volume also makes it brittle, so keep it away from impact.","Rough machine annealed, air harden (which is why it is dimensionally stable), then finish grind. Wire EDM is common for die profiles."],
["VHM-A2-PL","Tool steel","AISI A2 air-hardening tool steel plate","12 mm · 300 × 300 mm",19.60,"kg",1,3,5,"in",0,"toolst",{rho:7860,sy:1700,su:1900,E:203,hb:"60 HRC",K:24,a:10.6,tmax:425,corr:1,food:0,uv:2,recy:75,ee:42,kic:22,el:0},["balanced","air hardening"],"The sensible middle of the tool-steel range: most of D2's wear resistance with noticeably better toughness. When a student's Pugh chart is deadlocked between D2 and S7, A2 is usually the honest answer.","Air hardens with minimal distortion, so it can be finish machined close to size before heat treatment."],
["VHM-O1-FG","Tool steel","AISI O1 oil-hardening flat ground stock","6 × 50 mm · 500 mm",17.20,"kg",1,1,3,"in",0,"toolst",{rho:7850,sy:1600,su:1800,E:200,hb:"62 HRC",K:33,a:11.5,tmax:250,corr:1,food:0,uv:2,recy:78,ee:38,kic:20,el:0},["low cost tool steel","fine edge"],"The cheapest genuine tool steel and the easiest to heat treat in a small shop — it hardens from a simple oil quench at 800 °C. Excellent for knife edges and low-volume cutting tools where hot hardness is not required.","Harden in oil and temper immediately; O1 will crack if left untempered overnight. Expect about 0.1 % size change on quench."],
["VHM-S7-PL","Tool steel","AISI S7 shock-resisting tool steel plate","12 mm · 300 × 300 mm",24.80,"kg",1,3,7,"in",0,"toolst",{rho:7830,sy:1550,su:1700,E:207,hb:"56 HRC",K:31,a:12.5,tmax:500,corr:1,food:0,uv:2,recy:75,ee:46,kic:45,el:0},["impact tough","chisel"],"Deliberately traded hardness for toughness — fracture toughness near 45 MPa·m^0.5 against 16 for D2, at the cost of four points of hardness. This is the material for chipper anvils, shear blades and anything that takes a hammering.","Air hardens; can be finish machined before treatment. Do not push hardness above 58 HRC or you lose the toughness you bought it for."],
["VHM-H13-PL","Tool steel","AISI H13 hot-work tool steel plate","12 mm · 300 × 300 mm",26.90,"kg",1,3,7,"in",0,"toolst",{rho:7800,sy:1400,su:1550,E:210,hb:"50 HRC",K:28,a:11.5,tmax:600,corr:1,food:0,uv:2,recy:75,ee:48,kic:30,el:0},["thermal fatigue","hot work"],"Designed to resist thermal fatigue — the network of heat-checking cracks that destroys dies cycling between hot and cold. For a pellet-mill die running at 90 °C under continuous compression, this resistance matters more than raw hardness.","Machine annealed, vacuum harden and double temper. Nitride the working surface (MFW-HT-NITRIDE) for wear resistance without losing core toughness."],
["VHM-WC10-BLK","Cemented carbide","WC-10Co cemented carbide blank, ground","50 × 50 × 6 mm",104.00,"ea",0.218,1,7,"in",0,"carbide",{rho:14500,sy:0,su:2000,E:580,hb:"87 HRA / 1400 HV",K:80,a:5.5,tmax:800,corr:3,food:0,uv:5,recy:95,ee:400,kic:11,el:0},["extreme hardness","wear"],"Tungsten carbide grains in a cobalt binder — about three times the stiffness of steel and ten times the abrasive wear life, with essentially zero ductility. The 10 % cobalt grade trades a little hardness for enough toughness to survive intermittent cutting.","Cannot be machined conventionally. Shape by diamond grinding, wire EDM or as-sintered near-net form; braze or clamp it onto a steel body."],
["VHM-WC6-INS","Cemented carbide","WC-6Co brazable tip insert","20 × 12 × 4 mm",18.40,"ea",0.0143,4,5,"in",0,"carbide",{rho:14900,sy:0,su:1800,E:620,hb:"91 HRA / 1600 HV",K:85,a:5.0,tmax:900,corr:3,food:0,uv:5,recy:95,ee:400,kic:8,el:0},["hardest grade","brazable"],"The tip that gets brazed onto a steel blade body — the standard construction for carbide-tipped saw and plough blades. You buy carbide only where the wear happens and keep tough, cheap steel everywhere else. That is materials selection in one product.","Silver-brazed to a steel body with a stress-relieving shim to accommodate the four-fold mismatch in thermal expansion, then diamond ground."],
["VHM-WC10-ROD","Cemented carbide","WC-10Co solid carbide rod, ground","Ø12 mm · 330 mm",742.00,"m",1.640,0.33,10,"lo",0,"carbide",{rho:14500,sy:0,su:2000,E:580,hb:"87 HRA / 1400 HV",K:80,a:5.5,tmax:800,corr:3,food:0,uv:5,recy:95,ee:400,kic:11,el:0},["solid carbide","tooling"],"Solid rod for end mills and wear pins. At $742 per metre it is the most expensive stock item in this catalogue — a useful reminder that carbide is bought by the cubic centimetre, not the kilogram.","Diamond ground or EDM only. Handle carefully; it chips if dropped on a hard floor."],
["VHM-STEL-6","Hardfacing","Stellite 6 cobalt hardfacing rod","Ø3.2 mm · 5 kg",186.00,"kg",1,5,7,"in",0,"stellite",{rho:8460,sy:550,su:900,E:210,hb:"40 HRC",K:14.8,a:14.0,tmax:800,corr:5,food:1,uv:5,recy:60,ee:220,kic:25,el:1},["hot hardness","corrosion","food grade"],"A cobalt-chromium-tungsten alloy that keeps its hardness to 800 °C and resists corrosion at the same time — the combination is rare and expensive. Used to hard-face valve seats and food-processing knives where a steel weld overlay would corrode.","Deposited by GTAW or PTA over a buttered stainless layer; the substrate must be preheated to avoid cracking the deposit."],
["VHM-WCROD-HF","Hardfacing","Tungsten carbide composite hardfacing rod","Ø5 mm · 5 kg tube",128.00,"kg",1,5,5,"in",0,"carbide",{rho:9500,sy:0,su:700,E:250,hb:"60 HRC matrix / 2000 HV particles",K:40,a:10,tmax:600,corr:2,food:0,uv:3,recy:50,ee:250,kic:6,el:0},["rebuild","abrasion"],"Crushed carbide granules in a nickel or iron matrix, deposited by torch or arc. The go-to repair for worn plough shares, auger flights and mixer paddles — often more economical than replacing the part, which is a legitimate line in a life-cycle cost analysis.","Applied by oxy-acetylene or GMAW in a stringer pattern. Not machinable afterwards; it must be ground."],
["VHM-AL2O3-PL","Technical ceramics","99.5 % alumina ceramic plate","100 × 100 × 6 mm",86.00,"ea",0.234,1,10,"in",0,"alumina",{rho:3900,sy:0,su:350,E:375,hb:"1600 HV",K:30,a:8.2,tmax:1700,corr:5,food:1,uv:5,recy:20,ee:55,kic:4,el:0},["hardest oxide","inert","insulating"],"Harder than any steel, chemically inert, an electrical insulator, and usable to 1700 °C. It is also brittle with a fracture toughness of 4 MPa·m^0.5 — a hundredth of mild steel — so it must never see tensile or bending stress.","Supplied as-fired or ground. Bond into a compliant mount with a resilient adhesive; a rigid clamp will crack it on the first thermal cycle."],
["VHM-SIC-TILE","Technical ceramics","Sintered silicon carbide wear tile","50 × 50 × 12 mm",48.00,"ea",0.093,10,10,"in",0,"sic",{rho:3100,sy:0,su:400,E:410,hb:"2500 HV",K:120,a:4.0,tmax:1600,corr:5,food:0,uv:5,recy:20,ee:110,kic:3.5,el:0},["extreme abrasion","thermal shock"],"Harder than alumina with four times the thermal conductivity, so it survives thermal shock far better. Tiles like these are epoxy-bonded into a mosaic to line chutes and cyclones handling abrasive biomass.","Bonded into a steel backing with a flexible epoxy that lets adjacent tiles move independently. Individual tiles are replaceable — an important maintainability argument."],
["VHM-ZRO2-ROD","Technical ceramics","Yttria-stabilised zirconia (Y-TZP) rod","Ø10 mm · 300 mm",410.00,"m",0.475,0.3,14,"lo",0,"zirc",{rho:6050,sy:0,su:1000,E:210,hb:"1250 HV",K:2.0,a:10.3,tmax:1000,corr:5,food:1,uv:5,recy:10,ee:120,kic:10,el:0},["toughest ceramic","low conductivity"],"Transformation toughening gives zirconia a fracture toughness of about 10 MPa·m^0.5 — two and a half times alumina, and the reason it is the only ceramic used for knife blades. Its very low thermal conductivity also makes it a thermal barrier.","Diamond ground. Avoid prolonged exposure to 200–300 °C in humid air, which causes low-temperature degradation and surface spalling."],
["VHM-SI3N4-BALL","Technical ceramics","Silicon nitride bearing ball, Grade 5","Ø12.7 mm",28.50,"ea",0.0034,10,10,"in",0,"si3n4",{rho:3200,sy:0,su:800,E:310,hb:"1600 HV",K:30,a:3.2,tmax:1200,corr:5,food:1,uv:5,recy:10,ee:180,kic:6,el:0},["hybrid bearing","corrosion proof"],"Hybrid bearings with ceramic balls in steel races run faster and cooler, need no lubricant, and are immune to the corrosion that kills steel bearings in wash-down and slurry service. At 40 % the density of steel, centrifugal loading drops sharply too.","Supplied finish-lapped. Handle with clean gloves — surface contamination initiates spalling."],
["VHM-TIN-COAT","Surface coatings","TiN PVD coating service","Per dm² of coated surface",34.00,"m2",0,0.05,10,"in",0,"tin",{rho:5400,sy:0,su:0,E:600,hb:"2300 HV",K:19,a:9.4,tmax:600,corr:4,food:1,uv:5,recy:0,ee:0,kic:0,el:0},["service","hard coating","food safe"],"A 2–4 µm titanium nitride layer at 2300 HV — the familiar gold coating on drill bits. It roughly triples tool life for a few dollars per part and is food-contact approved, unlike most hard coatings.","Deposited at 450 °C, so the substrate must already be hardened and tempered above that temperature or it will soften in the chamber. Surfaces must be polished before coating — PVD replicates every scratch."],
["VHM-WCCO-HVOF","Surface coatings","WC-Co HVOF thermal spray coating","Per dm² of coated surface",92.00,"m2",0,0.05,12,"in",0,"carbide",{rho:14000,sy:0,su:0,E:300,hb:"1200 HV",K:30,a:6.0,tmax:500,corr:3,food:0,uv:5,recy:0,ee:0,kic:0,el:0},["service","thick coating","rebuild"],"High-velocity oxy-fuel spraying puts a 100–300 µm carbide layer onto a steel part — thick enough to rebuild worn dimensions, unlike PVD. It is the standard repair for pellet-mill rollers and pump sleeves.","Grit blast, spray, then diamond grind to final size. The bond is mechanical, so surface preparation determines whether the coating stays on."],
["VHM-DLC-COAT","Surface coatings","Diamond-like carbon (DLC) coating","Per dm² of coated surface",58.00,"m2",0,0.05,12,"in",0,"dlc",{rho:2200,sy:0,su:0,E:200,hb:"3000 HV",K:1.0,a:2.3,tmax:350,corr:5,food:1,uv:5,recy:0,ee:0,kic:0,el:0},["service","lowest friction"],"Hardest of the commercial coatings at up to 3000 HV with a friction coefficient near 0.1 — it is effectively a solid lubricant. Its 350 °C ceiling rules out hot-work applications.","Low-temperature PVD, so it will not temper a hardened substrate. Requires a very smooth, clean base surface."],
["VHM-CR-PLATE","Surface coatings","Hard chrome electroplating","Per dm² of coated surface",26.00,"m2",0,0.10,10,"in",0,"chrome",{rho:7190,sy:0,su:0,E:250,hb:"900 HV",K:94,a:6.2,tmax:400,corr:4,food:1,uv:5,recy:0,ee:0,kic:0,el:0},["service","cheapest hard coating"],"The cheapest hard surface per square decimetre and the traditional choice for hydraulic rods. It is also the environmental problem child of this page — hexavalent chromium plating faces tightening regulation, which is a real supply-chain risk for a 20-year design.","Plated 20–50 µm and ground to size. The coating is micro-cracked by design, so a nickel underlayer is required for genuine corrosion protection."],
["VHM-BIMET-34","Hardfacing","Bi-metal M42/carbon steel bandsaw blade stock","34 × 1.1 mm · per metre",28.40,"m",0.294,3,5,"in",0,"hss",{rho:7900,sy:1000,su:1300,E:210,hb:"67 HRC teeth / 45 HRC back",K:30,a:11.5,tmax:600,corr:1,food:0,uv:2,recy:70,ee:50,kic:30,el:2},["composite blade","best value"],"An electron-beam welded strip of M42 high-speed steel on a spring-steel back — hard teeth on a flexible body. It is the clearest everyday example of using two materials where one cannot do both jobs, and it is central to the sawmill-blade brief.","Supplied in coil and welded into a loop by the saw shop. Tooth pitch selection matters as much as the material: too fine and the gullet packs with sawdust and the blade overheats."]
],
MFW:[
["MFW-CNC3-HR","Machining","3-axis CNC milling","Shop rate, 0.25 h increments",95.00,"hr",0,1,3,"in",0,"svc",{rho:0},["service","prismatic"],"The default cost basis for a machined prismatic part. When you compare aluminium against steel, remember that aluminium cuts three to four times faster — often reversing the material-price ranking at the finished-part level.","Includes programming for simple parts. Complex 3D surfacing is quoted separately."],
["MFW-CNC5-HR","Machining","5-axis CNC milling","Shop rate, 0.25 h increments",215.00,"hr",0,1,7,"in",0,"svc",{rho:0},["service","complex geometry"],"Needed for impellers, turbine blade roots and any part with compound-angle features. At more than twice the 3-axis rate, a design change that keeps the part 3-axis machinable is often worth more than any material substitution.","Quote requires a 3D model. Fixture design is charged separately for first articles."],
["MFW-LATHE-HR","Machining","CNC turning","Shop rate, 0.25 h increments",108.00,"hr",0,1,3,"in",0,"svc",{rho:0},["service","round parts"],"For shafts, rollers, bushings and anything with an axis of revolution. Bar-fed production drops the effective rate sharply above about 50 pieces.","Includes standard tolerance of ±0.05 mm. Tighter tolerances need a grinding operation."],
["MFW-MANUAL-HR","Machining","Manual mill / lathe / fitting","Shop rate, 0.5 h increments",72.00,"hr",0,1,2,"in",0,"svc",{rho:0},["service","one-off"],"The cheapest route for a single prototype piece, because there is no programming or setup overhead to amortise. Above roughly five pieces CNC becomes cheaper — the classic break-even calculation.","Best for jigs, fixtures, modifications and repair work."],
["MFW-LASER-HR","Cutting","Fibre laser cutting, 6 kW","Shop rate; steel to 20 mm, stainless to 15 mm",145.00,"hr",0,1,3,"in",0,"svc",{rho:0},["service","precise","thin sheet"],"Fast, narrow kerf, near-zero taper and a very small heat-affected zone. Cannot cut most reflective aluminium and copper reliably at thickness, and cannot cut any non-metal.","Nesting efficiency drives the price — parts nested tightly on a full sheet cost far less per piece than the same parts cut individually."],
["MFW-WJET-HR","Cutting","Abrasive waterjet cutting","Shop rate; any material to 150 mm",168.00,"hr",0,1,4,"in",0,"svc",{rho:0},["service","no HAZ","any material"],"The only process here that cuts anything — hardened tool steel, titanium, glass, stone, FRP and composite laminate — with no heat-affected zone at all. It is slow, which is why it is the most expensive hourly rate on the cutting page.","Essential for AR500 and tool steel, where flame cutting would ruin the temper, and for composite panels, where a saw blade delaminates the edge."],
["MFW-PLASMA-M","Cutting","CNC plasma cutting","Per metre of cut, steel to 25 mm",6.80,"m",0,5,2,"in",0,"svc",{rho:0},["service","cheapest cut"],"The cheapest way to cut thick mild steel by a wide margin. Kerf is wide and tapered and the heat-affected zone extends a millimetre or two, so allow machining stock on any surface that matters.","Not suitable for stainless in food service without removing the oxidised cut edge — the HAZ is chromium depleted and will corrode."],
["MFW-GMAW-HR","Welding","GMAW (MIG) welding","Shop rate, certified welder",88.00,"hr",0,1,3,"in",0,"svcw",{rho:0},["service","fast","structural"],"The productivity workhorse for structural steel: high deposition rate, easily automated, and forgiving. Not suitable for out-of-position work on thin sheet or for sanitary joints.","Weld cost estimates should be built from deposited weld metal volume, not guesswork. A 6 mm fillet costs roughly four times a 3 mm fillet per metre."],
["MFW-GTAW-HR","Welding","GTAW (TIG) welding","Shop rate, certified welder",124.00,"hr",0,1,4,"in",0,"svcw",{rho:0},["service","precise","stainless"],"Slow, clean and fully controllable — the only manual process acceptable for thin stainless, aluminium and any joint that must be crevice-free after grinding. Expect roughly a third the deposition rate of GMAW.","Requires argon back-purge on stainless and titanium. Budget for the purge gas and dam materials, not just the arc time."],
["MFW-SMAW-HR","Welding","SMAW (stick) welding","Shop rate, field capable",78.00,"hr",0,1,2,"in",0,"svcw",{rho:0},["service","field repair"],"The field process: no shielding gas to blow away, works on rusty and painted material, and needs only a power source. Deposition rate and quality are the lowest of the three, and slag must be chipped between passes.","The realistic choice for on-farm repair, which is a legitimate maintainability argument in an agricultural design."],
["MFW-ORBITAL-W","Welding","Orbital tube welding, sanitary certified","Per weld, tube to 50 mm",46.00,"ea",0,4,5,"in",0,"svcw",{rho:0},["service","3-A","documented"],"Automated, fully documented, repeatable full-penetration tube welds with a smooth internal profile. Required for 3-A compliance in a milk line — a hand-made joint cannot meet the internal surface specification.","Requires square-cut, deburred tube ends, full argon purge and a weld coupon record for every joint. That documentation is much of what you are paying for."],
["MFW-HT-QT","Heat treatment","Quench and temper","Per kg of load, 25 kg minimum",7.40,"kg",0,25,7,"in",0,"svcht",{rho:0},["service","hardening"],"Turns an ordinary carbon or alloy steel into a high-strength one. On a $7.40/kg basis this is often cheaper than upgrading the alloy, which is exactly the sort of comparison a Pugh chart should surface.","Specify the target hardness range, not the process. Distortion is unavoidable — leave grinding stock on critical surfaces."],
["MFW-HT-CASE","Heat treatment","Carburising / case hardening","Per kg of load, 25 kg minimum",11.80,"kg",0,25,10,"in",0,"svcht",{rho:0},["service","surface hardening"],"Diffuses carbon into the surface to give a 0.5–1.5 mm case at 60 HRC over a tough, ductile core. It is how gear teeth and cam lobes get a hard wear surface without becoming brittle throughout.","Mask any surface that must stay soft, or machine the case off afterwards. Case depth must be specified — it drives cost more than part mass."],
["MFW-HT-NITRIDE","Heat treatment","Gas nitriding","Per kg of load, 25 kg minimum",16.40,"kg",0,25,14,"in",0,"svcht",{rho:0},["service","low distortion"],"Runs at 500–530 °C, below the tempering temperature, so the part barely moves — the deciding advantage for a finish-machined die or a long slender shaft. Case is thin (0.2–0.5 mm) but reaches 1000 HV.","Only works on nitriding steels containing aluminium, chromium or molybdenum — 4140 and H13 nitride well, plain 1018 does not."],
["MFW-HT-ANNEAL","Heat treatment","Stress-relief anneal","Per kg of load, 25 kg minimum",4.20,"kg",0,25,5,"in",0,"svcht",{rho:0},["service","stabilising"],"Relieves the residual stress left by welding, machining and forming. Skip it on a welded frame and the part will move during final machining or in its first thermal cycle in service.","Specify for any welded assembly that will be finish machined, and for any part that must hold tolerance over a long service life."],
["MFW-GALV-HD","Finishing & coating","Hot-dip galvanising to ASTM A123","Per kg of load, 50 kg minimum",2.35,"kg",0,50,7,"in",0,"svcht",{rho:0},["service","cheapest protection"],"The cheapest durable corrosion protection there is. An 85 µm coating on a rural structure gives 50 years or more to first maintenance, which is why it is the default for agricultural steelwork.","Assemblies must have vent and drain holes at every enclosed section, or the trapped air will explode in the 450 °C kettle. Design those holes in from the start."],
["MFW-POWDER-C","Finishing & coating","Polyester powder coating","Per m² of coated area",58.00,"m2",0,1,5,"in",0,"svc",{rho:0},["service","colour","UV"],"A tough, colour-fast, solvent-free finish. On its own it is a barrier coating only — one scratch through to the steel and undercutting rust begins, which is why the best specification is galvanise first, then powder coat over it.","Requires blast cleaning and phosphate pretreatment. Cures at 200 °C, so it cannot be applied over most polymers or heat-sensitive assemblies."],
["MFW-EPOXY-C","Finishing & coating","Fusion-bonded epoxy coating","Per m² of coated area",74.00,"m2",0,1,7,"in",0,"svc",{rho:0},["service","buried service","chemical"],"The pipeline coating: thick, chemically resistant, and formulated for buried and immersed service where powder coat would fail. Standard for buried tanks and epoxy-coated steel digesters.","Applied to a preheated blast-cleaned surface. Field joints and damage must be patched with a compatible liquid epoxy or the holiday becomes a corrosion cell."],
["MFW-PASSIVATE","Finishing & coating","Citric acid passivation to ASTM A967","Per kg of load",5.60,"kg",0,10,4,"in",0,"svc",{rho:0},["service","stainless","mandatory"],"Dissolves free iron left on a stainless surface by cutting, forming and grinding, then lets the chromium oxide film reform fully. Skip it and a perfectly specified 316L part will show rust spots within weeks — a very common and entirely avoidable failure.","Citric acid has largely replaced nitric acid: it works as well, is not an oxidiser, and the spent bath is far easier to treat."],
["MFW-ELECTROPOL","Finishing & coating","Electropolishing","Per dm² of surface",19.50,"m2",0,5,7,"in",0,"svc",{rho:0},["service","sanitary","Ra reduction"],"Removes 10–40 µm of the deformed surface layer electrochemically, typically halving Ra and enriching the surface in chromium. It is the standard finish for aseptic process equipment.","Weld beads must be ground flush first; electropolishing exaggerates any surface defect rather than hiding it."],
["MFW-BRAKE-BEND","Cutting","Press-brake forming","Per bend, up to 3 m length",8.50,"ea",0,4,3,"in",0,"svc",{rho:0},["service","sheet metal"],"Each bend is a discrete cost, so a part with twelve bends costs $102 in forming before any material. Redesigning to eight bends is usually a bigger saving than any material substitution.","Minimum inside bend radius is roughly one material thickness for mild steel and three for 6061-T6 aluminium; too tight and the outer fibre cracks."],
["MFW-INJMOLD-T","Tooling","Injection mould tooling, aluminium prototype","Single cavity, up to 150 × 150 mm",6800.00,"ea",0,1,28,"in",0,"svc",{rho:0},["service","NRE","amortise"],"A non-recurring engineering charge that must be divided across your production volume. Over 500 parts it adds $13.60 each; over 50,000 parts it adds $0.14. Getting this amortisation right is the whole point of a production-volume analysis.","Aluminium tooling is good for roughly 10,000 shots. Hardened steel tooling costs three to four times more and lasts a million."],
["MFW-INJMOLD-P","Tooling","Injection moulding, per part","Commodity polymer, 1000+ pieces",1.35,"ea",0,1000,35,"in",0,"svc",{rho:0},["service","high volume"],"Once the tool exists, each part costs little more than its material and a few seconds of machine time. This is why a moulded polymer component beats a machined one above a few thousand pieces and loses badly below a few hundred.","Includes material for a part of roughly 50 g. Cycle time, not material, dominates the per-part cost on thick sections."],
["MFW-ROTOMOLD","Tooling","Rotational moulding setup","Tank moulds to 2000 L",3400.00,"ea",0,1,21,"in",0,"svc",{rho:0},["service","hollow parts"],"The economical route to large hollow polyethylene parts — spray tanks, hopper liners, digester vessels. Tooling is a fraction of injection-mould cost because there is no injection pressure to contain.","Wall thickness is set by charge mass and is inherently variable; do not design a rotomoulded part with tight wall tolerance."],
["MFW-EXTRUDE-DIE","Tooling","Aluminium extrusion die","Profile within a 150 mm circle",2900.00,"ea",0,1,21,"in",0,"svc",{rho:0},["service","NRE","custom profile"],"A custom extrusion profile lets you integrate glazing channel, drainage gutter and fastener slot into a single part, deleting several assembly operations. Worth it above roughly 300 m of production.","Symmetric profiles with uniform wall thickness extrude cleanly; thin fins and sharp internal corners drive up die cost and scrap."],
["MFW-VACINF-HR","Machining","Vacuum infusion layup labour","Shop rate, composites",92.00,"hr",0,1,5,"in",0,"svc",{rho:0},["service","composites"],"Skilled labour is the dominant cost in any composite part — usually well over half. This is the single largest reason natural-fibre composites struggle to compete with stamped steel on a finished-part basis.","Includes consumables (bagging film, peel ply, flow media, tubing), which typically add 15–20 % to material cost on every part."],
["MFW-CERT-CMTR","Inspection","Mill test report / CMTR retrieval","Per heat number",45.00,"ea",0,1,3,"in",0,"svcqa",{rho:0},["service","documentation"],"Material traceability documentation. Any food-contact, pressure-containing or code-governed component needs it, and unheard-of as it may seem, the paperwork is sometimes the difference between an acceptable and a rejected installation.","Order it with the material — retrieving a certificate after the fact is often impossible once the heat is consumed."],
["MFW-NDT-DPI","Inspection","Dye penetrant inspection","Per part",38.00,"ea",0,5,3,"in",0,"svcqa",{rho:0},["service","surface cracks"],"Reveals surface-breaking cracks in welds and castings on any non-porous material. It is the cheapest weld inspection there is and finds the defects that matter most in fatigue-loaded parts.","Surface must be clean and free of paint. It finds only surface defects — subsurface porosity needs radiography or ultrasonics."],
["MFW-NDT-UT","Inspection","Ultrasonic weld inspection","Shop rate, certified Level II",155.00,"hr",0,1,5,"in",0,"svcqa",{rho:0},["service","volumetric"],"Detects internal lack of fusion and porosity in full-penetration welds. Required by code on pressure-containing welds — a digester tank shell, for example — and a legitimate line item in any safety-critical cost estimate.","Requires a smooth scanning surface and a calibration block of the same material and thickness."]
