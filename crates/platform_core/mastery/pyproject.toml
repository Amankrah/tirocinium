[build-system]
requires = ["maturin>=1.7,<2.0"]
# ^ bumped from >=1.4 for the PyO3 0.23 / abi3-py310 build on the platform
#   toolchain; the installed maturin 0.14 predates this build backend entirely.
build-backend = "maturin"

[project]
name = "tirocinium-mastery"
version = "0.1.0"
description = "Tirocinium mastery model (spec v0.2), Rust core with Python bindings"
requires-python = ">=3.10"

[tool.maturin]
features = ["python"]
module-name = "tirocinium_mastery"
