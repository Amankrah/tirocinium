["VHM-O1-FG","Tool steel","AISI O1 oil-hardening flat ground stock","6 × 50 mm · 500 mm",17.20,"kg",1,1,3,"in",0,"toolst",{rho:7850,sy:1600,su:1800,E:200,hb:"62 HRC",K:33,a:11.5,tmax:250,corr:1,food:0,uv:2,recy:78,ee:38,kic:20,el:0},["low cost tool steel","fine edge"],"The cheapest genuine tool steel and the easiest to heat treat in a small shop — it hardens from a simple oil quench at 800 °C. Excellent for knife edges and low-volume cutting tools where hot hardness is not required.","Harden in oil and temper immediately; O1 will crack if left untempered overnight. Expect about 0.1 % size change on quench."],
["VHM-S7-PL","Tool steel","AISI S7 shock-resisting tool steel plate","12 mm · 300 × 300 mm",24.80,"kg",1,3,7,"in",0,"toolst",{rho:7830,sy:1550,su:1700,E:207,hb:"56 HRC",K:31,a:12.5,tmax:500,corr:1,food:0,uv:2,recy:75,ee:46,kic:45,el:0},["impact tough","chisel"],"Deliberately traded hardness for toughness — fracture toughness near 45 MPa·m^0.5 against 16 for D2, at the cost of four points of hardness. This is the material for chipper anvils, shear blades and anything that takes a hammering.","Air hardens; can be finish machined before treatment. Do not push hardness above 58 HRC or you lose the toughness you bought it for."],
["VHM-H13-PL","Tool steel","AISI H13 hot-work tool steel plate","12 mm · 300 × 300 mm",26.90,"kg",1,3,7,"in",0,"toolst",{rho:7800,sy:1400,su:1550,E:210,hb:"50 HRC",K:28,a:11.5,tmax:600,corr:1,food:0,uv:2,recy:75,ee:48,kic:30,el:0},["thermal fatigue","hot work"],"Designed to resist thermal fatigue — the network of heat-checking cracks that destroys dies cycling between hot and cold. For a pellet-mill die running at 90 °C under continuous compression, this resistance matters more than raw hardness.","Machine annealed, vacuum harden and double temper. Nitride the working surface (MFW-HT-NITRIDE) for wear resistance without losing core toughness."],
["VHM-WC10-BLK","Cemented carbide","WC-10Co cemented carbide blank, ground","50 × 50 × 6 mm",104.00,"ea",0.218,1,7,"in",0,"carbide",{rho:14500,sy:0,su:2000,E:580,hb:"87 HRA / 1400 HV",K:80,a:5.5,tmax:800,corr:3,food:0,uv:5,recy:95,ee:400,kic:11,el:0},["extreme hardness","wear"],"Tungsten carbide grains in a cobalt binder — about three times the stiffness of steel and ten times the abrasive wear life, with essentially zero ductility. The 10 % cobalt grade trades a little hardness for enough toughness to survive intermittent cutting.","Cannot be machined conventionally. Shape by diamond grinding, wire EDM or as-sintered near-net form; braze or clamp it onto a steel body."],
["VHM-WC6-INS","Cemented carbide","WC-6Co brazable tip insert","20 × 12 × 4 mm",18.40,"ea",0.0143,4,5,"in",0,"carbide",{rho:14900,sy:0,su:1800,E:620,hb:"91 HRA / 1600 HV",K:85,a:5.0,tmax:900,corr:3,food:0,uv:5,recy:95,ee:400,kic:8,el:0},["hardest grade","brazable"],"The tip that gets brazed onto a steel blade body — the standard construction for carbide-tipped saw and plough blades. You buy carbide only where the wear happens and keep tough, cheap steel everywhere else. That is materials selection in one product.","Silver-brazed to a steel body with a stress-relieving shim to accommodate the four-fold mismatch in thermal expansion, then diamond ground."],
["VHM-WC10-ROD","Cemented carbide","WC-10Co solid carbide rod, ground","Ø12 mm · 330 mm",742.00,"m",1.640,0.33,10,"lo",0,"carbide",{rho:14500,sy:0,su:2000,E:580,hb:"87 HRA / 1400 HV",K:80,a:5.5,tmax:800,corr:3,food:0,uv:5,recy:95,ee:400,kic:11,el:0},["solid carbide","tooling"],"Solid rod for end mills and wear pins. At $742 per metre it is the most expensive stock item in this catalogue — a useful reminder that carbide is bought by the cubic centimetre, not the kilogram.","Diamond ground or EDM only. Handle carefully; it chips if dropped on a hard floor."],
["VHM-STEL-6","Hardfacing","Stellite 6 cobalt hardfacing rod","Ø3.2 mm · 5 kg",186.00,"kg",1,5,7,"in",0,"stellite",{rho:8460,sy:550,su:900,E:210,hb:"40 HRC",K:14.8,a:14.0,tmax:800,corr:5,food:1,uv:5,recy:60,ee:220,kic:25,el:1},["hot hardness","corrosion","food grade"],"A cobalt-chromium-tungsten alloy that keeps its hardness to 800 °C and resists corrosion at the same time — the combination is rare and expensive. Used to hard-face valve seats and food-processing knives where a steel weld overlay would corrode.","Deposited by GTAW or PTA over a buttered stainless layer; the substrate must be preheated to avoid cracking the deposit."],
["VHM-WCROD-HF","Hardfacing","Tungsten carbide composite hardfacing rod","Ø5 mm · 5 kg tube",128.00,"kg",1,5,5,"in",0,"carbide",{rho:9500,sy:0,su:700,E:250,hb:"60 HRC matrix / 2000 HV particles",K:40,a:10,tmax:600,corr:2,food:0,uv:3,recy:50,ee:250,kic:6,el:0},["rebuild","abrasion"],"Crushed carbide granules in a nickel or iron matrix, deposited by torch or arc. The go-to repair for worn plough shares, auger flights and mixer paddles — often more economical than replacing the part, which is a legitimate line in a life-cycle cost analysis.","Applied by oxy-acetylene or GMAW in a stringer pattern. Not machinable afterwards; it must be ground."],
["VHM-AL2O3-PL","Technical ceramics","99.5 % alumina ceramic plate","100 × 100 × 6 mm",86.00,"ea",0.234,1,10,"in",0,"alumina",{rho:3900,sy:0,su:350,E:375,hb:"1600 HV",K:30,a:8.2,tmax:1700,corr:5,food:1,uv:5,recy:20,ee:55,kic:4,el:0},["hardest oxide","inert","insulating"],"Harder than any steel, chemically inert, an electrical insulator, and usable to 1700 °C. It is also brittle with a fracture toughness of 4 MPa·m^0.5 — a hundredth of mild steel — so it must never see tensile or bending stress.","Supplied as-fired or ground. Bond into a compliant mount with a resilient adhesive; a rigid clamp will crack it on the first thermal cycle."],
["VHM-SIC-TILE","Technical ceramics","Sintered silicon carbide wear tile","50 × 50 × 12 mm",48.00,"ea",0.093,10,10,"in",0,"sic",{rho:3100,sy:0,su:400,E:410,hb:"2500 HV",K:120,a:4.0,tmax:1600,corr:5,food:0,uv:5,recy:20,ee:110,kic:3.5,el:0},["extreme abrasion","thermal shock"],"Harder than alumina with four times the thermal conductivity, so it survives thermal shock far better. Tiles like these are epoxy-bonded into a mosaic to line chutes and cyclones handling abrasive biomass.","Bonded into a steel backing with a flexible epoxy that lets adjacent tiles move independently. Individual tiles are replaceable — an important maintainability argument."],
["VHM-ZRO2-ROD","Technical ceramics","Yttria-stabilised zirconia (Y-TZP) rod","Ø10 mm · 300 mm",410.00,"m",0.475,0.3,14,"lo",0,"zirc",{rho:6050,sy:0,su:1000,E:210,hb:"1250 HV",K:2.0,a:10.3,tmax:1000,corr:5,food:1,uv:5,recy:10,ee:120,kic:10,el:0},["toughest ceramic","low conductivity"],"Transformation toughening gives zirconia a fracture toughness of about 10 MPa·m^0.5 — two and a half times alumina, and the reason it is the only ceramic used for knife blades. Its very low thermal conductivity also makes it a thermal barrier.","Diamond ground. Avoid prolonged exposure to 200–300 °C in humid air, which causes low-temperature degradation and surface spalling."],
["VHM-SI3N4-BALL","Technical ceramics","Silicon nitride bearing ball, Grade 5","Ø12.7 mm",28.50,"ea",0.0034,10,10,"in",0,"si3n4",{rho:3200,sy:0,su:800,E:310,hb:"1600 HV",K:30,a:3.2,tmax:1200,corr:5,food:1,uv:5,recy:10,ee:180,kic:6,el:0},["hybrid bearing","corrosion proof"],"Hybrid bearings with ceramic balls in steel races run faster and cooler, need no lubricant, and are immune to the corrosion that kills steel bearings in wash-down and slurry service. At 40 % the density of steel, centrifugal loading drops sharply too.","Supplied finish-lapped. Handle with clean gloves — surface contamination initiates spalling."],
["VHM-TIN-COAT","Surface coatings","TiN PVD coating service","Per dm² of coated surface",34.00,"m2",0,0.05,10,"in",0,"tin",{rho:5400,sy:0,su:0,E:600,hb:"2300 HV",K:19,a:9.4,tmax:600,corr:4,food:1,uv:5,recy:0,ee:0,kic:0,el:0},["service","hard coating","food safe"],"A 2–4 µm titanium nitride layer at 2300 HV — the familiar gold coating on drill bits. It roughly triples tool life for a few dollars per part and is food-contact approved, unlike most hard coatings.","Deposited at 450 °C, so the substrate must already be hardened and tempered above that temperature or it will soften in the chamber. Surfaces must be polished before coating — PVD replicates every scratch."],
["VHM-WCCO-HVOF","Surface coatings","WC-Co HVOF thermal spray coating","Per dm² of coated surface",92.00,"m2",0,0.05,12,"in",0,"carbide",{rho:14000,sy:0,su:0,E:300,hb:"1200 HV",K:30,a:6.0,tmax:500,corr:3,food:0,uv:5,recy:0,ee:0,kic:0,el:0},["service","thick coating","rebuild"],"High-velocity oxy-fuel spraying puts a 100–300 µm carbide layer onto a steel part — thick enough to rebuild worn dimensions, unlike PVD. It is the standard repair for pellet-mill rollers and pump sleeves.","Grit blast, spray, then diamond grind to final size. The bond is mechanical, so surface preparation determines whether the coating stays on."],
["VHM-DLC-COAT","Surface coatings","Diamond-like carbon (DLC) coating","Per dm² of coated surface",58.00,"m2",0,0.05,12,"in",0,"dlc",{rho:2200,sy:0,su:0,E:200,hb:"3000 HV",K:1.0,a:2.3,tmax:350,corr:5,food:1,uv:5,recy:0,ee:0,kic:0,el:0},["service","lowest friction"],"Hardest of the commercial coatings at up to 3000 HV with a friction coefficient near 0.1 — it is effectively a solid lubricant. Its 350 °C ceiling rules out hot-work applications.","Low-temperature PVD, so it will not temper a hardened substrate. Requires a very smooth, clean base surface."],
["VHM-CR-PLATE","Surface coatings","Hard chrome electroplating","Per dm² of coated surface",26.00,"m2",0,0.10,10,"in",0,"chrome",{rho:7190,sy:0,su:0,E:250,hb:"900 HV",K:94,a:6.2,tmax:400,corr:4,food:1,uv:5,recy:0,ee:0,kic:0,el:0},["service","cheapest hard coating"],"The cheapest hard surface per square decimetre and the traditional choice for hydraulic rods. It is also the environmental problem child of this page — hexavalent chromium plating faces tightening regulation, which is a real supply-chain risk for a 20-year design.","Plated 20–50 µm and ground to size. The coating is micro-cracked by design, so a nickel underlayer is required for genuine corrosion protection."],
["VHM-BIMET-34","Hardfacing","Bi-metal M42/carbon steel bandsaw blade stock","34 × 1.1 mm · per metre",28.40,"m",0.294,3,5,"in",0,"hss",{rho:7900,sy:1000,su:1300,E:210,hb:"67 HRC teeth / 45 HRC back",K:30,a:11.5,tmax:600,corr:1,food:0,uv:2,recy:70,ee:50,kic:30,el:2},["composite blade","best value"],"An electron-beam welded strip of M42 high-speed steel on a spring-steel back — hard teeth on a flexible body. It is the clearest everyday example of using two materials where one cannot do both jobs, and it is central to the sawmill-blade brief.","Supplied in coil and welded into a loop by the saw shop. Tooth pitch selection matters as much as the material: too fine and the gullet packs with sawdust and the blade overheats."]
],
MFW:[
["MFW-CNC3-HR","Machining","3-axis CNC milling","Shop rate, 0.25 h increments",95.00,"hr",0,1,3,"in",0,"svc",{rho:0},["service","prismatic"],"The default cost basis for a machined prismatic part. When you compare aluminium against steel, remember that aluminium cuts three to four times faster — often reversing the material-price ranking at the finished-part level.","Includes programming for simple parts. Complex 3D surfacing is quoted separately."],
["MFW-CNC5-HR","Machining","5-axis CNC milling","Shop rate, 0.25 h increments",215.00,"hr",0,1,7,"in",0,"svc",{rho:0},["service","complex geometry"],"Needed for impellers, turbine blade roots and any part with compound-angle features. At more than twice the 3-axis rate, a design change that keeps the part 3-axis machinable is often worth more than any material substitution.","Quote requires a 3D model. Fixture design is charged separately for first articles."],
["MFW-LATHE-HR","Machining","CNC turning","Shop rate, 0.25 h increments",108.00,"hr",0,1,3,"in",0,"svc",{rho:0},["service","round parts"],"For shafts, rollers, bushings and anything with an axis of revolution. Bar-fed production drops the effective rate sharply above about 50 pieces.","Includes standard tolerance of ±0.05 mm. Tighter tolerances need a grinding operation."],
["MFW-MANUAL-HR","Machining","Manual mill / lathe / fitting","Shop rate, 0.5 h increments",72.00,"hr",0,1,2,"in",0,"svc",{rho:0},["service","one-off"],"The cheapest route for a single prototype piece, because there is no programming or setup overhead to amortise. Above roughly five pieces CNC becomes cheaper — the classic break-even calculation.","Best for jigs, fixtures, modifications and repair work."],
["MFW-LASER-HR","Cutting","Fibre laser cutting, 6 kW","Shop rate; steel to 20 mm, stainless to 15 mm",145.00,"hr",0,1,3,"in",0,"svc",{rho:0},["service","precise","thin sheet"],"Fast, narrow kerf, near-zero taper and a very small heat-affected zone. Cannot cut most reflective aluminium and copper reliably at thickness, and cannot cut any non-metal.","Nesting efficiency drives the price — parts nested tightly on a full sheet cost far less per piece than the same parts cut individually."],
["MFW-WJET-HR","Cutting","Abrasive waterjet cutting","Shop rate; any material to 150 mm",168.00,"hr",0,1,4,"in",0,"svc",{rho:0},["service","no HAZ","any material"],"The only process here that cuts anything — hardened tool steel, titanium, glass, stone, FRP and composite laminate — with no heat-affected zone at all. It is slow, which is why it is the most expensive hourly rate on the cutting page.","Essential for AR500 and tool steel, where flame cutting would ruin the temper, and for composite panels, where a saw blade delaminates the edge."],
["MFW-PLASMA-M","Cutting","CNC plasma cutting","Per metre of cut, steel to 25 mm",6.80,"m",0,5,2,"in",0,"svc",{rho:0},["service","cheapest cut"],"The cheapest way to cut thick mild steel by a wide margin. Kerf is wide and tapered and the heat-affected zone extends a millimetre or two, so allow machining stock on any surface that matters.","Not suitable for stainless in food service without removing the oxidised cut edge — the HAZ is chromium depleted and will corrode."],
["MFW-GMAW-HR","Welding","GMAW (MIG) welding","Shop rate, certified welder",88.00,"hr",0,1,3,"in",0,"svcw",{rho:0},["service","fast","structural"],"The productivity workhorse for structural steel: high deposition rate, easily automated, and forgiving. Not suitable for out-of-position work on thin sheet or for sanitary joints.","Weld cost estimates should be built from deposited weld metal volume, not guesswork. A 6 mm fillet costs roughly four times a 3 mm fillet per metre."],
["MFW-GTAW-HR","Welding","GTAW (TIG) welding","Shop rate, certified welder",124.00,"hr",0,1,4,"in",0,"svcw",{rho:0},["service","precise","stainless"],"Slow, clean and fully controllable — the only manual process acceptable for thin stainless, aluminium and any joint that must be crevice-free after grinding. Expect roughly a third the deposition rate of GMAW.","Requires argon back-purge on stainless and titanium. Budget for the purge gas and dam materials, not just the arc time."],
["MFW-SMAW-HR","Welding","SMAW (stick) welding","Shop rate, field capable",78.00,"hr",0,1,2,"in",0,"svcw",{rho:0},["service","field repair"],"The field process: no shielding gas to blow away, works on rusty and painted material, and needs only a power source. Deposition rate and quality are the lowest of the three, and slag must be chipped between passes.","The realistic choice for on-farm repair, which is a legitimate maintainability argument in an agricultural design."],
["MFW-ORBITAL-W","Welding","Orbital tube welding, sanitary certified","Per weld, tube to 50 mm",46.00,"ea",0,4,5,"in",0,"svcw",{rho:0},["service","3-A","documented"],"Automated, fully documented, repeatable full-penetration tube welds with a smooth internal profile. Required for 3-A compliance in a milk line — a hand-made joint cannot meet the internal surface specification.","Requires square-cut, deburred tube ends, full argon purge and a weld coupon record for every joint. That documentation is much of what you are paying for."],
["MFW-HT-QT","Heat treatment","Quench and temper","Per kg of load, 25 kg minimum",7.40,"kg",0,25,7,"in",0,"svcht",{rho:0},["service","hardening"],"Turns an ordinary carbon or alloy steel into a high-strength one. On a $7.40/kg basis this is often cheaper than upgrading the alloy, which is exactly the sort of comparison a Pugh chart should surface.","Specify the target hardness range, not the process. Distortion is unavoidable — leave grinding stock on critical surfaces."],
["MFW-HT-CASE","Heat treatment","Carburising / case hardening","Per kg of load, 25 kg minimum",11.80,"kg",0,25,10,"in",0,"svcht",{rho:0},["service","surface hardening"],"Diffuses carbon into the surface to give a 0.5–1.5 mm case at 60 HRC over a tough, ductile core. It is how gear teeth and cam lobes get a hard wear surface without becoming brittle throughout.","Mask any surface that must stay soft, or machine the case off afterwards. Case depth must be specified — it drives cost more than part mass."],
["MFW-HT-NITRIDE","Heat treatment","Gas nitriding","Per kg of load, 25 kg minimum",16.40,"kg",0,25,14,"in",0,"svcht",{rho:0},["service","low distortion"],"Runs at 500–530 °C, below the tempering temperature, so the part barely moves — the deciding advantage for a finish-machined die or a long slender shaft. Case is thin (0.2–0.5 mm) but reaches 1000 HV.","Only works on nitriding steels containing aluminium, chromium or molybdenum — 4140 and H13 nitride well, plain 1018 does not."],
["MFW-HT-ANNEAL","Heat treatment","Stress-relief anneal","Per kg of load, 25 kg minimum",4.20,"kg",0,25,5,"in",0,"svcht",{rho:0},["service","stabilising"],"Relieves the residual stress left by welding, machining and forming. Skip it on a welded frame and the part will move during final machining or in its first thermal cycle in service.","Specify for any welded assembly that will be finish machined, and for any part that must hold tolerance over a long service life."],
["MFW-GALV-HD","Finishing & coating","Hot-dip galvanising to ASTM A123","Per kg of load, 50 kg minimum",2.35,"kg",0,50,7,"in",0,"svcht",{rho:0},["service","cheapest protection"],"The cheapest durable corrosion protection there is. An 85 µm coating on a rural structure gives 50 years or more to first maintenance, which is why it is the default for agricultural steelwork.","Assemblies must have vent and drain holes at every enclosed section, or the trapped air will explode in the 450 °C kettle. Design those holes in from the start."],
["MFW-POWDER-C","Finishing & coating","Polyester powder coating","Per m² of coated area",58.00,"m2",0,1,5,"in",0,"svc",{rho:0},["service","colour","UV"],"A tough, colour-fast, solvent-free finish. On its own it is a barrier coating only — one scratch through to the steel and undercutting rust begins, which is why the best specification is galvanise first, then powder coat over it.","Requires blast cleaning and phosphate pretreatment. Cures at 200 °C, so it cannot be applied over most polymers or heat-sensitive assemblies."],
["MFW-EPOXY-C","Finishing & coating","Fusion-bonded epoxy coating","Per m² of coated area",74.00,"m2",0,1,7,"in",0,"svc",{rho:0},["service","buried service","chemical"],"The pipeline coating: thick, chemically resistant, and formulated for buried and immersed service where powder coat would fail. Standard for buried tanks and epoxy-coated steel digesters.","Applied to a preheated blast-cleaned surface. Field joints and damage must be patched with a compatible liquid epoxy or the holiday becomes a corrosion cell."],
["MFW-PASSIVATE","Finishing & coating","Citric acid passivation to ASTM A967","Per kg of load",5.60,"kg",0,10,4,"in",0,"svc",{rho:0},["service","stainless","mandatory"],"Dissolves free iron left on a stainless surface by cutting, forming and grinding, then lets the chromium oxide film reform fully. Skip it and a perfectly specified 316L part will show rust spots within weeks — a very common and entirely avoidable failure.","Citric acid has largely replaced nitric acid: it works as well, is not an oxidiser, and the spent bath is far easier to treat."],
["MFW-ELECTROPOL","Finishing & coating","Electropolishing","Per dm² of surface",19.50,"m2",0,5,7,"in",0,"svc",{rho:0},["service","sanitary","Ra reduction"],"Removes 10–40 µm of the deformed surface layer electrochemically, typically halving Ra and enriching the surface in chromium. It is the standard finish for aseptic process equipment.","Weld beads must be ground flush first; electropolishing exaggerates any surface defect rather than hiding it."],
["MFW-BRAKE-BEND","Cutting","Press-brake forming","Per bend, up to 3 m length",8.50,"ea",0,4,3,"in",0,"svc",{rho:0},["service","sheet metal"],"Each bend is a discrete cost, so a part with twelve bends costs $102 in forming before any material. Redesigning to eight bends is usually a bigger saving than any material substitution.","Minimum inside bend radius is roughly one material thickness for mild steel and three for 6061-T6 aluminium; too tight and the outer fibre cracks."],
["MFW-INJMOLD-T","Tooling","Injection mould tooling, aluminium prototype","Single cavity, up to 150 × 150 mm",6800.00,"ea",0,1,28,"in",0,"svc",{rho:0},["service","NRE","amortise"],"A non-recurring engineering charge that must be divided across your production volume. Over 500 parts it adds $13.60 each; over 50,000 parts it adds $0.14. Getting this amortisation right is the whole point of a production-volume analysis.","Aluminium tooling is good for roughly 10,000 shots. Hardened steel tooling costs three to four times more and lasts a million."],
["MFW-INJMOLD-P","Tooling","Injection moulding, per part","Commodity polymer, 1000+ pieces",1.35,"ea",0,1000,35,"in",0,"svc",{rho:0},["service","high volume"],"Once the tool exists, each part costs little more than its material and a few seconds of machine time. This is why a moulded polymer component beats a machined one above a few thousand pieces and loses badly below a few hundred.","Includes material for a part of roughly 50 g. Cycle time, not material, dominates the per-part cost on thick sections."],
["MFW-ROTOMOLD","Tooling","Rotational moulding setup","Tank moulds to 2000 L",3400.00,"ea",0,1,21,"in",0,"svc",{rho:0},["service","hollow parts"],"The economical route to large hollow polyethylene parts — spray tanks, hopper liners, digester vessels. Tooling is a fraction of injection-mould cost because there is no injection pressure to contain.","Wall thickness is set by charge mass and is inherently variable; do not design a rotomoulded part with tight wall tolerance."],
["MFW-EXTRUDE-DIE","Tooling","Aluminium extrusion die","Profile within a 150 mm circle",2900.00,"ea",0,1,21,"in",0,"svc",{rho:0},["service","NRE","custom profile"],"A custom extrusion profile lets you integrate glazing channel, drainage gutter and fastener slot into a single part, deleting several assembly operations. Worth it above roughly 300 m of production.","Symmetric profiles with uniform wall thickness extrude cleanly; thin fins and sharp internal corners drive up die cost and scrap."],
["MFW-VACINF-HR","Machining","Vacuum infusion layup labour","Shop rate, composites",92.00,"hr",0,1,5,"in",0,"svc",{rho:0},["service","composites"],"Skilled labour is the dominant cost in any composite part — usually well over half. This is the single largest reason natural-fibre composites struggle to compete with stamped steel on a finished-part basis.","Includes consumables (bagging film, peel ply, flow media, tubing), which typically add 15–20 % to material cost on every part."],
["MFW-CERT-CMTR","Inspection","Mill test report / CMTR retrieval","Per heat number",45.00,"ea",0,1,3,"in",0,"svcqa",{rho:0},["service","documentation"],"Material traceability documentation. Any food-contact, pressure-containing or code-governed component needs it, and unheard-of as it may seem, the paperwork is sometimes the difference between an acceptable and a rejected installation.","Order it with the material — retrieving a certificate after the fact is often impossible once the heat is consumed."],
["MFW-NDT-DPI","Inspection","Dye penetrant inspection","Per part",38.00,"ea",0,5,3,"in",0,"svcqa",{rho:0},["service","surface cracks"],"Reveals surface-breaking cracks in welds and castings on any non-porous material. It is the cheapest weld inspection there is and finds the defects that matter most in fatigue-loaded parts.","Surface must be clean and free of paint. It finds only surface defects — subsurface porosity needs radiography or ultrasonics."],
["MFW-NDT-UT","Inspection","Ultrasonic weld inspection","Shop rate, certified Level II",155.00,"hr",0,1,5,"in",0,"svcqa",{rho:0},["service","volumetric"],"Detects internal lack of fusion and porosity in full-penetration welds. Required by code on pressure-containing welds — a digester tank shell, for example — and a legitimate line item in any safety-critical cost estimate.","Requires a smooth scanning surface and a calibration block of the same material and thickness."]

/* ============================================================
   ENVIRONMENTAL INDICATOR LAYER  (BREE 216 · L9 Material
   Selection and Sustainability)
   ------------------------------------------------------------
   Every stocked material carries three indicators normalised
   PER KILOGRAMME of material, plus an end-of-life recovery
   figure, so that they can be compared directly and multiplied
   by the mass your design actually consumes:

     ee   embodied energy       MJ / kg
     co2  carbon footprint      kg CO2-eq / kg   (cradle-to-gate)
     h2o  water footprint       L / kg
     recy realistic end-of-life recovery rate, %
     eol  the end-of-life route in words
     tmin lowest useful service temperature, degC (where it governs)

   Values are cradle-to-gate, benchmarked against the ranges in
   the BREE 216 L9 lecture tables and standard LCI datasets.
   Process steps (welding, heat treatment, coating) instead carry
   pe / pco2 -- energy and carbon PER UNIT OF PROCESS, because a
   process has no mass of its own.
   ============================================================ */

env(["CPP-PP-SH12","CPP-PPR-50","CPP-PP-NFT"],{ee:78,co2:2.00,h2o:45,recy:20,tmin:0,

env(["CPP-PC-TW8","CPP-PC-TW16","CPP-PC-SOL6"],{ee:110,co2:6.00,h2o:200,recy:25,tmin:-40,

env(["TFC-CF-200"],{ee:280,co2:25.00,h2o:300,recy:5,tmin:-100,

env(["TFC-HEMP-400","TFC-HEMPPLA-SH"],{ee:8.0,co2:0.45,h2o:2300,recy:88,tmin:-40,

env(["TFC-HEMPPP-SH"],{ee:42,co2:1.25,h2o:1100,recy:35,tmin:-10,

env(["TFC-POLY-GP"],{ee:63,co2:3.00,h2o:90,recy:0,tmin:-30,eol:"Thermoset: no recycling route. Styrene emissions during layup are also an occupational-health consideration."});
env(["TFC-VE-700"],{ee:70,co2:3.60,h2o:100,recy:0,tmin:-40,eol:"Thermoset: no recycling route."});
env(["TFC-EP-635"],{ee:110,co2:6.00,h2o:150,recy:0,tmin:-60,eol:"Thermoset: no recycling route. Its low cure shrinkage is what makes natural-fibre laminates possible, so it is often the enabling choice despite the footprint."});
env(["TFC-BIO-56"],{ee:52,co2:2.60,h2o:210,recy:0,tmin:-50,

env(["TFC-FURAN"],{ee:35,co2:1.40,h2o:160,recy:0,tmin:-20,

env(["TFC-ELIUM"],{ee:95,co2:4.80,h2o:140,recy:75,tmin:-40,

env(["TFC-GELCOAT"],{ee:68,co2:3.40,h2o:95,recy:0,tmin:-30,eol:"Thermoset surface layer; no recycling route, but it is what prevents blistering and doubles the panel's service life."});
env(["TFC-FRP-PAN3"],{ee:60,co2:3.10,h2o:80,recy:4,tmin:-40,eol:"Ground as filler or landfilled. Its case rests on outlasting the galvanised steel it replaces by two to three times."});

env(["TFC-CORE-15"],{ee:100,co2:4.50,h2o:110,recy:8,tmin:-60,eol:"Cross-linked PVC foam: not re-meltable. Offcuts are typically landfilled, and core waste on a curved part can exceed 30 %."});
env(["TFC-PETFOAM-20"],{ee:45,co2:1.90,h2o:65,recy:70,tmin:-60,

env(["TFC-HEMPBLK"],{ee:2.5,co2:-0.60,h2o:180,recy:95,tmin:-40,

env(["TFC-SIP-50"],{ee:18,co2:0.35,h2o:900,recy:55,tmin:-40,eol:"Bio-skins and bio-core; separable at end of life only if mechanically fastened rather than bonded."});
env(["TFC-CEDAR-TB"],{ee:3.4,co2:-1.15,h2o:350,recy:70,tmin:-60,

env(["TFC-CEDAR-PT"],{ee:6.8,co2:-0.45,h2o:400,recy:10,tmin:-60,

env(["TFC-TMWOOD"],{ee:8.5,co2:-0.85,h2o:380,recy:60,tmin:-60,

env(["TFC-PLY-18"],{ee:15,co2:-0.55,h2o:500,recy:25,tmin:-40,eol:"Phenolic adhesive limits recycling to particleboard feedstock or energy recovery; still net carbon-storing while in service."});
env(["TFC-OSB-15"],{ee:12,co2:-0.65,h2o:420,recy:15,tmin:-40,eol:"Made from fast-growing small-diameter wood that has little other use. Swells irreversibly once wet, which usually ends its life."});
env(["TFC-GLULAM"],{ee:12,co2:-1.05,h2o:450,recy:40,tmin:-60,

env(["VHM-D2-PL"],{ee:44,co2:3.20,h2o:72,recy:75,eol:"Recycled as high-chromium alloy scrap."});
env(["VHM-A2-PL"],{ee:42,co2:3.00,h2o:70,recy:75,eol:"Recycled as alloy tool-steel scrap."});
env(["VHM-O1-FG"],{ee:38,co2:2.80,h2o:68,recy:78,eol:"The least alloyed tool steel here, and correspondingly the easiest to recycle and the lowest in carbon."});
env(["VHM-S7-PL"],{ee:46,co2:3.40,h2o:74,recy:75,eol:"Recycled as alloy scrap. Its toughness means parts are re-ground rather than scrapped, extending life several times over."});
env(["VHM-H13-PL"],{ee:48,co2:3.60,h2o:76,recy:75,eol:"Recycled as hot-work alloy scrap; dies are typically re-nitrided and returned to service two or three times first."});
env(["VHM-WC10-BLK","VHM-WC6-INS","VHM-WC10-ROD"],{ee:400,co2:32.00,h2o:260,recy:95,

env(["VHM-STEL-6"],{ee:220,co2:28.00,h2o:300,recy:60,eol:"Cobalt is a critical raw material with significant mining impacts; worn hardfacing is recovered where the deposit is thick enough to strip."});
env(["VHM-WCROD-HF"],{ee:250,co2:21.00,h2o:220,recy:40,

env(["VHM-AL2O3-PL"],{ee:55,co2:3.20,h2o:70,recy:15,eol:"Chemically inert and safe to landfill; can be crushed as refractory aggregate."});
env(["VHM-SIC-TILE"],{ee:110,co2:6.50,h2o:90,recy:12,eol:"Individual tiles are replaceable, so the mosaic is repaired rather than replaced — a maintainability argument with a real carbon dividend."});

env(["VHM-SI3N4-BALL"],{ee:180,co2:11.00,h2o:150,recy:5,

env(["VHM-BIMET-34"],{ee:50,co2:4.00,h2o:85,recy:65,

env(["VPK-VPET-SH"],{ee:84,co2:2.90,h2o:62,recy:60,tmin:-40,

env(["VPK-HDPE-TUB"],{ee:80,co2:2.10,h2o:70,recy:32,tmin:-50,

env(["VPK-ALFOIL-LID"],{ee:165,co2:10.20,h2o:1250,recy:25,tmin:-80,

env(["VPK-BIOWAX"],{ee:28,co2:0.85,h2o:480,recy:0,tmin:-40,

/* --- process steps: energy and carbon PER UNIT OF PROCESS ------- */
function penv(k,pe,pco2,note){ENV[k]={pe,pco2,pnote:note};}
penv("MFW-CNC3-HR",54,0.02,"Electric load on the Québec grid, which emits about 1.5 g CO2/kWh. The identical job in Alberta would emit roughly 7.5 kg CO2 per hour — a 300-fold difference from location alone.");
penv("MFW-CNC5-HR",90,0.04,"Higher spindle and axis load. Grid carbon as above.");
penv("MFW-LATHE-HR",60,0.03,"Electric load; chips are collected and returned to the melt.");
penv("MFW-MANUAL-HR",18,0.01,"Lowest process energy of any machining route — a reminder that for one prototype, the simplest process is usually also the lightest.");
penv("MFW-LASER-HR",105,0.05,"Includes nitrogen or oxygen assist gas. Tight nesting reduces both cost and material carbon.");
penv("MFW-WJET-HR",140,0.90,"Garnet abrasive dominates the footprint: roughly 25 kg per hour, mined, shipped and then landfilled as slurry.");
penv("MFW-PLASMA-M",4.0,0.03,"Per metre of cut. Wide kerf means more material converted to dross than with laser.");
penv("MFW-GMAW-HR",40,1.90,"Shielding gas dominates: argon–CO2 mixtures are released directly to atmosphere at 15–20 L/min.");
penv("MFW-GTAW-HR",30,0.55,"Pure argon shielding at a lower flow rate; slower deposition but a much smaller gas burden per hour.");
penv("MFW-SMAW-HR",45,0.35,"No shielding gas at all — the flux does the work. Often the lowest-carbon welding process available in the field.");
penv("MFW-ORBITAL-W",6,0.35,"Per weld, including the internal argon purge that sanitary work requires.");
penv("MFW-HT-QT",3.5,0.20,"Per kg of load, gas-fired furnace. Heat treating a cheap steel is often lower-carbon than specifying a more heavily alloyed one.");
penv("MFW-HT-CASE",6.0,0.34,"Per kg. Long furnace cycles at 900 °C make carburising the most energy-intensive heat treatment here.");
penv("MFW-HT-NITRIDE",8.5,0.48,"Per kg. Long cycle at lower temperature, plus ammonia dissociation.");
penv("MFW-HT-ANNEAL",2.0,0.11,"Per kg. Cheap in both money and carbon, and it prevents the distortion that would otherwise scrap the part.");
penv("MFW-GALV-HD",3.2,0.21,"Per kg, including the zinc coating itself. Adds about 10 % to the steel's cradle-to-gate carbon and removes decades of repainting from the use phase.");
penv("MFW-POWDER-C",25,1.45,"Per m². Solvent-free, but the 200 °C cure oven dominates the energy.");
penv("MFW-EPOXY-C",32,1.95,"Per m². Preheat plus cure; formulated for buried service where a thinner coating would fail early.");
penv("MFW-PASSIVATE",1.2,0.09,"Per kg. Citric acid has displaced nitric: comparable performance, far lower effluent treatment burden.");
penv("MFW-ELECTROPOL",2.5,0.11,"Per dm². The spent electrolyte is metal-bearing hazardous waste — the highest-impact step in a sanitary fabrication.");
penv("MFW-BRAKE-BEND",0.8,0.001,"Per bend. Negligible energy; the carbon question with forming is how much material the blank wastes.");
penv("MFW-INJMOLD-T",9500,640,"One-off tooling. Amortise this over your production volume before comparing it with anything.");
penv("MFW-INJMOLD-P",3.2,0.09,"Per part, excluding the polymer itself. Cycle energy is small; the material choice dominates.");
penv("MFW-ROTOMOLD",4200,290,"One-off tooling for large hollow parts.");
penv("MFW-EXTRUDE-DIE",3100,210,"One-off die. A profile that deletes assembly operations can repay its die carbon quickly.");
penv("MFW-VACINF-HR",12,2.80,"Per hour, dominated by single-use consumables — bagging film, peel ply, flow media and tubing, all landfilled after one cure.");
penv("MFW-CERT-CMTR",0,0,"Documentation only.");
penv("MFW-NDT-DPI",1.5,0.12,"Per part, including solvent penetrant and developer.");
penv("MFW-NDT-UT",8,0.02,"Per hour. Couplant and electrical load only.");
penv("VHM-TIN-COAT",9,0.05,"Per dm². Vacuum PVD on the Québec grid; the coating triples tool life, so it usually pays back many times in avoided tool manufacture.");
penv("VHM-WCCO-HVOF",46,3.10,"Per dm². Oxy-fuel combustion plus carbide powder, roughly half of which overspray is lost.");
penv("VHM-DLC-COAT",14,0.07,"Per dm². Low-temperature PVD, low direct carbon.");
penv("VHM-CR-PLATE",11,0.55,"Per dm². Hexavalent chromium plating carries significant effluent treatment and a tightening regulatory outlook.");

ROWS.VPK=[
["VPK-GLASS-JAR","Glass containers","Soda-lime glass container, standard wall","500 mL wide-mouth · 245 g",0.78,"ea",0.245,1000,10,"in",0,"glass",{rho:2500,sy:0,su:50,E:70,hb:"550 HV",K:1.0,a:9.0,tmax:500,corr:5,food:1,uv:5,recy:70,ee:15,kic:0.7,el:0},["zero leaching","infinitely recyclable","heavy"],"Chemically inert: nothing migrates from glass into food, which settles the microplastic question outright. It is also infinitely recyclable with no downgrading. The penalty is mass — 245 g of container for 500 mL of product — and brittleness, with a fracture toughness of 0.7 MPa·m½.","Press-and-blow formed from a gob at 1150 °C, then annealed through a lehr to remove forming stresses. Thermal shock resistance is limited to about 40 °C of sudden change, which matters for a hot-fill or blast-freeze line."],
["VPK-GLASS-LW","Glass containers","Lightweighted soda-lime glass container","500 mL wide-mouth · 165 g",0.86,"ea",0.165,1000,14,"in",0,"glass",{rho:2500,sy:0,su:50,E:70,hb:"550 HV",K:1.0,a:9.0,tmax:500,corr:5,food:1,uv:5,recy:70,ee:15,kic:0.7,el:0},["33 % less mass","same material"],"Identical glass, narrow-neck-press-and-blow formed to a thinner and more even wall: 33 % less mass for the same capacity, at 10 % more money. Put this beside the standard jar on your chart — it is the cleanest demonstration in the catalogue that material efficiency, not material substitution, is often the largest available saving.","Narrow-neck press and blow with tighter process control. The thinner wall reduces impact resistance, so the distribution packaging has to work harder."],
["VPK-GLASS-CULLET","Glass containers","High-cullet glass container, 70 % recycled","500 mL wide-mouth · 245 g",0.82,"ea",0.245,1000,14,"in",0,"glasscul",{rho:2500,sy:0,su:50,E:70,hb:"550 HV",K:1.0,a:9.0,tmax:500,corr:5,food:1,uv:5,recy:70,ee:9.5,kic:0.7,el:0},["recycled content","lower melt energy"],"The same container melted from a 70 % post-consumer cullet charge. Cullet melts at a lower temperature than raw batch, so every 10 % of cullet cuts furnace energy about 3 % and CO2 about 5 %. The result is a third less carbon for 5 % more money and a slight green tint.","Identical forming. Colour control is the practical limit on cullet fraction — mixed-colour cullet cannot make flint glass."],
["VPK-PHA-R","Bio-polymers","PHA resin, injection grade","Polyhydroxyalkanoate · 25 kg sack",8.40,"kg",1,25,14,"in",0,"pha",{rho:1240,sy:25,su:32,E:1.5,hb:"70 Shore D",K:0.20,a:120,tmax:110,corr:4,food:1,uv:2,recy:15,ee:52,kic:1.8,el:8},["marine compostable","food grade","bio-based"],"A polyester made by bacteria from sugar or waste feedstock. It is one of very few polymers that biodegrades in seawater, soil and a home compost bin without industrial conditions — so it does not fragment into persistent microplastic. It is also four times the price of polypropylene and noticeably more brittle.","Injection moulded or thermoformed at low melt temperature; PHA degrades above about 170 °C, so the processing window is narrow and must be dried beforehand."],
["VPK-PHA-SH","Bio-polymers","PHA/PBAT blend sheet, thermoform grade","0.9 mm · 700 mm web",12.60,"kg",1,25,18,"lo",0,"pha",{rho:1250,sy:20,su:28,E:1.1,hb:"62 Shore D",K:0.20,a:130,tmax:100,corr:4,food:1,uv:2,recy:15,ee:54,kic:2.6,el:40},["compostable","tougher blend","thermoformable"],"Blending PBAT into PHA buys back the impact toughness and elongation that pure PHA lacks, which is what makes a drop-resistant frozen container feasible. Both constituents are compostable, so the blend keeps the end-of-life story intact.","Thermoformed from roll stock. Blend ratio trades stiffness against toughness — state which you specified and why."],
["VPK-PLA-R","Bio-polymers","PLA resin, injection grade","Polylactic acid · 25 kg sack",4.30,"kg",1,25,7,"in",0,"pla",{rho:1240,sy:55,su:60,E:3.5,hb:"85 Shore D",K:0.13,a:70,tmax:55,corr:3,food:1,uv:2,recy:8,ee:42,kic:1.2,el:4},["bio-based","low cost","brittle when cold"],"The cheapest bio-based polymer and the most widely available, with a genuinely low production carbon. Read the two catches carefully: it softens at 55 °C, and it is industrially compostable only — it will not break down in a home bin, in soil or in the sea, and it contaminates the PET recycling stream.","Injection moulded or thermoformed after drying. Its 4 % elongation and low impact strength at freezer temperature are the governing constraints for a cold-chain container."],
["VPK-PBD-AQ","Fibre-based packaging","Aqueous-dispersion-coated paperboard","350 g/m² · FSC virgin fibre",1.95,"m2",0.365,500,10,"in",0,"board",{rho:750,sy:0,su:32,E:4.0,hb:"n/a",K:0.07,a:12,tmax:90,corr:2,food:1,uv:1,recy:72,ee:26,kic:1.5,el:2},["repulpable","food grade","bio-based"],"A water-borne polymer dispersion is coated onto the board instead of laminating a polyethylene film to it. The coating re-pulps with the fibre, so the finished carton goes into the ordinary paper recycling stream rather than to landfill. That single difference is worth 52 points of recovery rate.","Reel-fed converting, creased and glued. Barrier performance against fat and moisture is lower than PE lamination, so shelf-life must be verified against the actual product."],
["VPK-PBD-PE","Fibre-based packaging","PE-extrusion-coated paperboard","350 g/m² · 18 µm PE film",1.52,"m2",0.372,500,7,"in",0,"boardpe",{rho:760,sy:0,su:34,E:4.2,hb:"n/a",K:0.07,a:12,tmax:90,corr:3,food:1,uv:1,recy:20,ee:31,kic:1.6,el:2},["cheapest barrier","not repulpable"],"The incumbent: cheaper than the aqueous coating, a better moisture and grease barrier, and effectively unrecyclable outside the handful of mills with a dedicated repulper. This is the direct comparator that makes the aqueous-coated board's premium defensible or not.","Extrusion coating in line with the board machine. Include it in your shortlist as the economic datum even if you do not recommend it."],
["VPK-PULP-M","Fibre-based packaging","Moulded pulp container, recycled fibre","500 mL · 28 g",0.41,"ea",0.028,1000,14,"in",0,"pulp",{rho:600,sy:0,su:18,E:2.2,hb:"n/a",K:0.06,a:15,tmax:120,corr:1,food:1,uv:1,recy:80,ee:22,kic:0.8,el:2},["lowest mass","compostable","needs barrier"],"Twenty-eight grams against 245 for glass — roughly a ninth of the mass, made from recycled fibre, repulpable and compostable. It will not hold a wet or fatty product on its own, so it needs a barrier coating, and that is precisely where its clean recycling story can unravel.","Vacuum-formed from a fibre slurry and hot-press dried. Pair it with the bio-wax coating rather than a fluorochemical if you want to keep the compostability claim."],
["VPK-RPET-SH","Recycled polymers","Recycled PET sheet, 100 % post-consumer","0.6 mm · food-contact approved",3.85,"kg",1,25,10,"in",0,"rpet",{rho:1340,sy:52,su:57,E:2.8,hb:"85 Shore D",K:0.20,a:70,tmax:70,corr:4,food:1,uv:3,recy:60,ee:32,kic:3.2,el:70},["recycled content","food grade","tough when cold"],"Bottle-derived flake, decontaminated to food-contact standard and re-extruded into sheet. It cuts energy and carbon by roughly 60 % against virgin PET while keeping the same properties and staying in the same recycling stream at end of life.","Thermoformed after drying. Food-contact approval depends on the decontamination process being certified — ask for the letter of no objection, not just the claim."],
["VPK-VPET-SH","Recycled polymers","Virgin PET sheet","0.6 mm · food-contact approved",3.10,"kg",1,25,7,"in",0,"vpet",{rho:1340,sy:55,su:60,E:2.9,hb:"85 Shore D",K:0.20,a:70,tmax:70,corr:4,food:1,uv:3,recy:60,ee:84,kic:3.2,el:75},["cheaper","higher carbon"],"Place this next to the recycled grade. It is 19 % cheaper per kilogramme and carries roughly 2.8 times the carbon. There is no performance reason to prefer it here — which makes it a clean test of whether your Pugh chart weights are doing any real work.","Identical processing to the recycled grade."],
["VPK-PP-TUB","Recycled polymers","Food-grade polypropylene tub resin","Injection grade · 25 kg sack",2.65,"kg",1,25,7,"in",0,"pptub",{rho:905,sy:33,su:38,E:1.5,hb:"75 Shore D",K:0.22,a:100,tmax:100,corr:5,food:1,uv:1,recy:20,ee:78,kic:3.0,el:150},["low cost","autoclavable","brittle below 0 °C"],"The lowest-carbon commodity polymer and the cheapest container material here. Its disqualifying weakness for a frozen product is the ductile-to-brittle transition near 0 °C: a tub that survives a drop at room temperature shatters at −18 °C.","Injection moulded. If you specify PP for cold service you must show impact data at the actual service temperature, not at 23 °C."],
["VPK-HDPE-TUB","Recycled polymers","Food-grade HDPE tub resin","Injection grade · 25 kg sack",2.45,"kg",1,25,7,"in",0,"hdpe",{rho:955,sy:26,su:33,E:1.1,hb:"66 Shore D",K:0.45,a:200,tmax:80,corr:5,food:1,uv:3,recy:32,ee:80,kic:3.8,el:600},["tough at −50 °C","widely recycled","incumbent"],"The material most frozen dessert tubs are actually made from, and the incumbent your alternatives must beat. It stays tough to −50 °C, is collected and recycled in most Canadian municipalities, and costs less than polypropylene. It is still a fossil polymer that fragments rather than degrades.","Injection moulded. Note that it beats PP on cold toughness and recycling rate while losing on stiffness and production carbon — a genuine four-way trade."],
["VPK-ALFOIL-LID","Barrier coatings","Aluminium foil lidding laminate","40 µm foil / PET / sealant web",0.42,"m2",0.135,500,12,"in",0,"foil",{rho:2710,sy:35,su:80,E:69,hb:"n/a",K:210,a:23.6,tmax:150,corr:4,food:1,uv:5,recy:25,ee:165,kic:20,el:8},["absolute barrier","multi-material"],"A total barrier to oxygen, light and moisture, which no polymer achieves. It is also a three-layer laminate that cannot be separated, so neither the aluminium nor the polymer is ever recovered. Multi-material laminates are the clearest case of a design decision defeating recycling.","Heat-sealed to the container flange. If recyclability is a weighted criterion in your chart, a mono-material lidding film scores far better even though it performs worse."],
["VPK-BIOWAX","Barrier coatings","Bio-based barrier wax coating","Plant-derived · 20 kg pail",9.80,"kg",1,20,14,"in",0,"biowax",{rho:950,sy:0,su:4,E:0.02,hb:"n/a",K:0.25,a:200,tmax:60,corr:3,food:1,uv:2,recy:0,ee:28,kic:0,el:20},["compostable","grease barrier","food grade"],"A plant-wax dispersion that gives fibre packaging a grease and moisture barrier while remaining compostable with the substrate — unlike a fluorochemical or polyethylene barrier, which ends the carton's recycling life. Service temperature is capped at 60 °C.","Roll-coated or sprayed onto board or moulded pulp. Barrier performance is modest, so it suits chilled and frozen rather than long-ambient shelf life."]
];

ROWS.TFC.push(
["TFC-SGLASS-300","Glass reinforcement","S-2 glass fabric, high-strength grade","300 g/m² · 1.0 m wide",32.50,"m2",0.300,2,10,"in",0,"sglass",{rho:2490,sy:0,su:4890,E:87,hb:"n/a",K:1.45,a:2.9,tmax:815,corr:4,food:0,uv:4,recy:8,ee:75,kic:18,el:5.4},["40 % stronger than E-glass","fatigue"],"Magnesium-aluminosilicate glass with roughly 40 % more tensile strength and 20 % more modulus than E-glass, and markedly better fatigue performance — which is why it appears in blade root laminates. It costs about five times E-glass and takes 55 % more energy to melt.","Vacuum infusion or prepreg. Use it selectively in the highest-strain plies rather than throughout, or the cost case collapses."],
["TFC-CGHYB-300","Glass reinforcement","Carbon / E-glass hybrid twill","300 g/m² · 50:50 by area",29.80,"m2",0.300,2,10,"in",0,"hybrid",{rho:1900,sy:0,su:1800,E:105,hb:"n/a",K:5.0,a:1.5,tmax:400,corr:5,food:0,uv:5,recy:6,ee:140,kic:18,el:1.8},["stiffness","half the carbon cost"],"Alternating carbon and glass tows give most of carbon's stiffness at roughly half its price and half its embodied carbon, and the glass arrests the brittle failure that pure carbon laminates show. This is how production wind blades are actually built.","Infusion with epoxy or a recyclable thermoplastic resin. Watch the galvanic couple: carbon is cathodic to every metal fastener you might put through it."],
["TFC-BASFRP-TUBE","Pultruded & panel","Pultruded basalt-FRP square tube","50 × 50 × 6 mm · 6 m",52.40,"m",1.900,1,14,"in",8.00,"basfrp",{rho:1950,sy:0,su:480,E:34,hb:"Barcol 55",K:0.30,a:6.0,tmax:200,corr:5,food:0,uv:5,recy:6,ee:30,kic:14,el:1.6},["cold tough","corrosion proof","low carbon"],"Basalt-fibre pultrusion — the \"glass-basalt plastic\" of the Arctic greenhouse brief. Twice the stiffness of E-glass pultrusion, usable to −200 °C without embrittlement, and roughly 40 % lower production carbon than the E-glass equivalent. It weighs a quarter of the galvanised steel tube of the same size.","Cut with a diamond blade and seal the ends. Bolted brackets only. Strongly anisotropic, so check bearing and transverse strength at every connection."],
["TFC-BASFRP-PROF","Pultruded & panel","Pultruded basalt-FRP structural rafter","100 × 50 mm channel · 6 m",78.60,"m",3.050,1,14,"lo",10.00,"basfrp",{rho:1950,sy:0,su:480,E:34,hb:"Barcol 55",K:0.30,a:6.0,tmax:200,corr:5,food:0,uv:5,recy:6,ee:30,kic:14,el:1.6},["structural","light","no thermal bridge"],"Deeper section for rafters and purlins. Its thermal conductivity is 0.30 W/m·K against 52 for steel, so it does not act as a thermal bridge through the envelope — a significant advantage in an Arctic greenhouse where frame conduction is a real heat loss path.","Design to a deflection limit, not a stress limit. Local flange buckling governs long before the material fails."],
["TFC-PETFOAM-20","Core materials","Recyclable PET structural foam core","20 mm · 100 kg/m³",54.20,"m2",2.000,2,10,"in",0,"petfoam",{rho:100,sy:1.5,su:2.6,E:0.11,hb:"n/a",K:0.034,a:45,tmax:150,corr:4,food:0,uv:1,recy:70,ee:45,kic:0.35,el:12},["recyclable core","higher temp"],"Foamed from recycled PET bottle flake and itself recyclable — which is why it is displacing cross-linked PVC foam in wind-blade cores. It carries 25 % more compressive stress than PVC foam at the same density, tolerates 150 °C for prepreg cure, and has less than half its embodied carbon.","Vacuum bagged between skins. Thermoformable, so it drapes to a curved blade shell without scoring."],
["TFC-ELIUM","Resins","Recyclable liquid thermoplastic resin (acrylic)","15 L kit · infusion grade",38.90,"L",1.010,4,14,"lo",0,"elium",{rho:1180,sy:76,su:80,E:3.3,hb:"M90",K:0.19,a:70,tmax:90,corr:4,food:0,uv:3,recy:75,ee:95,kic:2.8,el:6},["recyclable composite","weldable","infusible"],"A liquid acrylic that infuses at room temperature like a thermoset but cures to a thermoplastic. The finished laminate can be depolymerised back to monomer or simply re-melted, which makes it the only route in this catalogue to a structural composite that is genuinely recyclable. Laminates can also be welded rather than bonded.","Vacuum infusion with a peroxide initiator, ambient cure. Exotherm control matters in thick laminates; the styrene-free chemistry improves shop air quality."],
["TFC-HEMPPLA-SH","Pultruded & panel","Hemp / PLA biocomposite sheet","6 mm · 1220 × 2440 mm",46.80,"m2",4.200,2,14,"in",0,"hemppla",{rho:700,sy:0,su:48,E:5.5,hb:"n/a",K:0.09,a:30,tmax:55,corr:2,food:0,uv:1,recy:40,ee:22,kic:1.4,el:2},["fully bio-based","compostable matrix"],"Hemp fibre in a polylactic acid matrix — the \"hemp-based polymer matrix\" of the biocomposite panel brief, and the only fully bio-based option here in which both phases come from plants. The binding constraint is the matrix: PLA softens at about 55 °C, which a south-facing wall cavity can reach.","Compression moulded from a commingled mat. Must be kept dry in service; both phases absorb moisture and the panel swells."],
["TFC-HEMPPP-SH","Pultruded & panel","Hemp / polypropylene composite sheet","4 mm · 1220 × 2440 mm",28.40,"m2",4.000,2,10,"in",0,"hemppp",{rho:1000,sy:0,su:42,E:4.2,hb:"n/a",K:0.12,a:45,tmax:100,corr:4,food:0,uv:2,recy:35,ee:42,kic:2.8,el:4},["re-mouldable","automotive grade","moisture tolerant"],"Natural-fibre reinforced polypropylene, the material behind millions of car door cards. A thermoplastic matrix means offcuts and end-of-life panels can be re-ground and re-moulded — the one natural-fibre composite here with a real recycling route — and it tolerates moisture far better than a PLA matrix.","Compression moulded from a needled hemp/PP mat at 200 °C. Requires a maleic-anhydride coupling agent for fibre–matrix adhesion."],
["TFC-CEDAR-TB","Timber & panel","Western red cedar timber, kiln dried","38 × 140 mm · 3.66 m",14.20,"m",1.970,2,7,"in",5.00,"cedar",{rho:370,sy:0,su:52,E:7.7,hb:"350 N Janka",K:0.09,a:4.5,tmax:100,corr:3,food:0,uv:3,recy:70,ee:3.4,kic:0.6,el:1},["naturally durable","carbon storing","light"],"Naturally rot- and insect-resistant because of its thujaplicin extractives, so it needs no preservative treatment at all. It stores biogenic carbon, has the second-lowest embodied energy in the catalogue, and is light enough to matter when every kilogram is freighted north. Its strength is modest and it is anisotropic.","Cut and fastened with stainless or hot-dip galvanised fixings only — cedar extractives corrode plain steel and the resulting tannin stains are permanent."],
["TFC-CEDAR-PT","Timber & panel","Pressure-treated SPF timber, copper azole","38 × 140 mm · 3.66 m",9.60,"m",2.350,2,5,"in",5.00,"cedarpt",{rho:470,sy:0,su:44,E:9.5,hb:"n/a",K:0.12,a:4.5,tmax:100,corr:2,food:0,uv:2,recy:10,ee:6.8,kic:0.6,el:1},["cheapest durable timber","treated waste"],"A third cheaper than cedar and stronger, with durability bought from copper-azole preservative rather than from the tree. The trade is the end of life: treated wood cannot be burnt, composted or chipped, so landfill is the normal route and the recovery rate collapses from 70 % to 10 %.","Cut ends must be field-treated or the untreated heartwood is exposed. Use only stainless or heavy hot-dip galvanised fasteners — the copper in the treatment attacks aluminium and plain steel."],
["TFC-TMWOOD","Timber & panel","Thermally modified ash, exterior grade","20 × 140 mm · 3.6 m",22.80,"m",1.900,2,14,"in",5.00,"tmwood",{rho:620,sy:0,su:68,E:11.0,hb:"1300 N Janka",K:0.11,a:4.0,tmax:100,corr:3,food:0,uv:3,recy:60,ee:8.5,kic:0.7,el:1},["chemical-free durability","dimensionally stable"],"Heating hardwood to 200 °C in a low-oxygen kiln destroys the hemicellulose that fungi feed on and the hydroxyl groups that absorb water. The result resists rot like a treated product and moves half as much with humidity, with no chemistry added — so all the end-of-life routes of plain timber stay open.","Machines like a dense hardwood but is more brittle; pre-drill every fastener. Surface greys in UV unless it is oiled."],
["TFC-PLY-18","Timber & panel","Exterior-grade Douglas fir plywood","18 mm · 1220 × 2440 mm",76.50,"ea",32.200,1,5,"in",0,"ply",{rho:600,sy:0,su:35,E:9.0,hb:"n/a",K:0.13,a:6.0,tmax:100,corr:2,food:0,uv:1,recy:25,ee:15,kic:0.8,el:1},["structural panel","the datum"],"The conventional panel your biocomposite has to beat on cost. Cross-laminated veneers make it far less anisotropic than solid timber, it is structurally rated, and it is cheap. The phenolic adhesive limits it to downcycling or energy recovery at end of life.","Cut and fastened conventionally. Every cut edge must be sealed in exterior use or the plies delaminate from the edge inward."],
["TFC-OSB-15","Timber & panel","Oriented strand board, exterior grade","15 mm · 1220 × 2440 mm",38.90,"ea",29.100,1,5,"in",0,"osb",{rho:650,sy:0,su:28,E:5.5,hb:"n/a",K:0.13,a:6.5,tmax:100,corr:2,food:0,uv:1,recy:15,ee:12,kic:0.6,el:1},["cheapest panel","swells when wet"],"The cheapest structural panel available and the second economic datum for the biocomposite brief. It is made from fast-growing small-diameter wood with little other use, which is a genuine sustainability argument. It also swells irreversibly at the edges once wet, and that usually ends its life.","Cut and fastened conventionally. Edge swelling is the governing durability failure — detail it to stay dry or do not use it."],
["TFC-GLULAM","Timber & panel","Glued-laminated spruce beam","80 × 200 mm · per metre",58.40,"m",7.700,1,14,"in",12.00,"glulam",{rho:480,sy:0,su:64,E:12.5,hb:"n/a",K:0.12,a:5.0,tmax:100,corr:2,food:0,uv:2,recy:40,ee:12,kic:0.7,el:1},["long span","carbon storing"],"Laminating small boards into a large section removes the defects that limit solid timber and allows spans that sawn wood cannot reach. It stores biogenic carbon for the life of the building and, if bolted rather than glued into the structure, can be demounted and re-used.","Delivered to length with connections pre-machined. Protect from wetting during construction; glulam is an interior or protected-exterior material unless specifically detailed."]

/* per-kg helpers ------------------------------------------------ */
function envOf(p){return p.p||{};}
function hasEnv(p){return envOf(p).co2!==undefined;}
/* embodied energy and carbon of ONE unit of this line item */
function unitEE(p){ return p.pe!==undefined ? p.pe : (p.kgu||0)*(envOf(p).ee||0); }
function unitCO2(p){return p.pco2!==undefined? p.pco2: (p.kgu||0)*(envOf(p).co2||0); }
function unitH2O(p){return p.pe!==undefined ? 0   : (p.kgu||0)*(envOf(p).h2o||0); }

/* where a value sits against the L9 lecture benchmark bands ------ */
const BANDS={
 ee:[[5,"Very low"],[15,"Low"],[40,"Moderate"],[90,"High"],[1e9,"Very high"]],
 co2:[[0.5,"Very low"],[1.5,"Low"],[4,"Moderate"],[10,"High"],[1e9,"Very high"]],
 h2o:[[50,"Very low"],[150,"Low"],[500,"Moderate"],[1500,"High"],[1e9,"Very high"]],
 recy:[[10,"Very poor"],[30,"Poor"],[55,"Moderate"],[80,"Good"],[1e9,"Excellent"]]
};
const BANDC={"Very low":"g","Low":"g","Moderate":"y","High":"r","Very high":"r",
             "Very poor":"r","Poor":"r","Good":"g","Excellent":"g"};
function band(k,v){
  if(v===undefined||v===null) return null;
  if(k==="co2"&&v<0) return "Carbon negative";
  for(const b of BANDS[k]) if(v<=b[0]) return b[1];
  return null;
}
function bandc(l){return l==="Carbon negative"?"g":(BANDC[l]||"");}
const num=(v,d)=>Number(v).toLocaleString("en-CA",{minimumFractionDigits:d===undefined?0:d,maximumFractionDigits:d===undefined?2:d});

/* small eco strip used on cards --------------------------------- */
function ecostrip(p){
  if(p.pe!==undefined) return `<div class="eco"><span title="Process energy per unit">⚡ ${num(p.pe,0)} MJ</span><span title="Process carbon per unit">☁ ${num(p.pco2,2)} kg CO₂</span></div>`;
  const e=envOf(p); if(e.co2===undefined) return "";
  return `<div class="eco">
    <span title="Embodied energy per kilogramme">⚡ ${num(e.ee,1)} MJ/kg</span>
    <span class="${e.co2<0?"neg":""}" title="Carbon footprint per kilogramme">☁ ${num(e.co2,2)} kg CO₂/kg</span>
  </div>`;
}


/* volume breaks: generic ladder applied to stock materials */
function breaks(p){
  if(p.svc) return [];
  if(p.unit==="kg") return [[100,4],[500,9],[2000,14]];
  if(p.unit==="m")  return [[50,3],[200,7],[600,11]];
  if(p.unit==="m2") return [[25,4],[100,8]];
  if(p.unit==="L")  return [[40,5],[160,10]];
  return [[25,3],[100,7],[500,12]];
}
function breakPct(p,q){let d=0;breaks(p).forEach(b=>{if(q>=b[0])d=b[1];});return d;}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function perKg(p){return p.kgu>0?p.price/p.kgu:null;}
function stockTxt(s){return s==="in"?["In stock","i"]:s==="lo"?["Low stock","l"]:["Backorder","o"];}

/* ============================================================
   Router
   ============================================================ */
function go(h){location.hash=h;}
function parseHash(){
  const h=location.hash.replace(/^#\/?/,"");
  const [path,qs]=h.split("?");
  const seg=path.split("/").filter(Boolean);
  const q=new URLSearchParams(qs||"");
  if(!seg.length) return {v:"home"};
  if(seg[0]==="store") return {v:"store",id:seg[1]};
  if(seg[0]==="p")     return {v:"product",sku:decodeURIComponent(seg[1]||"")};
  if(seg[0]==="search")return {v:"search",q:q.get("q")||""};
  if(seg[0]==="briefs")return {v:"briefs"};
  if(seg[0]==="brief") return {v:"brief",i:+seg[1]};
  if(seg[0]==="sources")return{v:"sources"};
  if(seg[0]==="how")   return {v:"how"};
  if(seg[0]==="env")   return {v:"env"};
  return {v:"home"};
}
window.addEventListener("hashchange",()=>{VIEW=parseHash();FILT.cat.clear();FILT.tag.clear();render();window.scrollTo(0,0);});

function envPanel(p){
  if(p.pe!==undefined){
    return `<h3 style="margin-top:20px">Process footprint <span class="muted" style="font-weight:400">— per ${UNITL[p.unit]} of process</span></h3>
    <div class="ecogrid">
      <div class="et"><span>Process energy</span><b>${num(p.pe,1)}</b><i>MJ per ${UNITL[p.unit]}</i></div>
      <div class="et"><span>Process carbon</span><b>${num(p.pco2,3)}</b><i>kg CO\u2082e per ${UNITL[p.unit]}</i></div>
    </div>
    ${p.pnote?`<div class="notice b" style="margin-top:10px"><b>A process has no mass, so it has no per-kilogramme figure.</b> ${esc(p.pnote)}</div>`:""}`;
  }
  const e=envOf(p); if(e.co2===undefined) return "";
  const t=(lbl,v,d,u,k)=>{const b=band(k,v);
    return `<div class="et"><span>${lbl}</span><b class="${v<0?"neg":""}">${num(v,d)}</b><i>${u}</i>${b?`<em class="tag ${bandc(b)}">${b}</em>`:""}</div>`;};
  return `<h3 style="margin-top:20px">Environmental indicators <span class="muted" style="font-weight:400">— per kilogramme of material</span></h3>
  <div class="ecogrid">
    ${t("Embodied energy",e.ee,1,"MJ / kg","ee")}
    ${t("Carbon footprint",e.co2,2,"kg CO\u2082e / kg","co2")}
    ${t("Water footprint",e.h2o,0,"L / kg","h2o")}
    ${t("End-of-life recovery",e.recy,0,"% recovered","recy")}
  </div>
  ${(p.kgu&&p.unit!=="kg")?`<div class="notice b" style="margin-top:10px"><b>For one ${UNITL[p.unit]} as supplied</b> — ${num(p.kgu,3)} kg — that is <b>${num(unitEE(p),1)} MJ</b> of embodied energy and <b>${num(unitCO2(p),2)} kg CO\u2082e</b>. Always multiply the per-kilogramme figure by the mass your design actually consumes.</div>`:""}
  ${p.eol?`<div class="notice" style="margin-top:10px"><b>End of life.</b> ${esc(p.eol)}</div>`:""}
  ${e.tmin!==undefined?`<div class="notice b" style="margin-top:10px"><b>Lowest useful service temperature: ${e.tmin} \u00b0C.</b> Below this the material either embrittles or softens out of usefulness. Check it against your brief before anything else.</div>`:""}`;
}

      ${(FILT.cat.size||FILT.tag.size)?`<button class="btn gh sm wide" onclick="FILT.cat.clear();FILT.tag.clear();render()">Clear filters</button>`:""}

    </div>

</div>`;
}
function sortItems(a){
  const f=FILT.sort;const c=[...a];
  if(f==="plo")c.sort((x,y)=>x.price-y.price);
  if(f==="phi")c.sort((x,y)=>y.price-x.price);
  if(f==="klo")c.sort((x,y)=>(perKg(x)??9e9)-(perKg(y)??9e9));
  if(f==="den")c.sort((x,y)=>(x.p.rho||9e9)-(y.p.rho||9e9));
  if(f==="str")c.sort((x,y)=>(y.p.sy||-1)-(x.p.sy||-1));
  return c;
}
function tgl(k,v){const S=FILT[k];S.has(v)?S.delete(v):S.add(v);render();}

        <td class="n">&minus;0.5 to 0.2<br><span class="tiny muted">kg CO&#8322;e/kg, wood</span></td>
        <td class="n">&minus;0.55 / &minus;0.65<br><span class="tiny muted">kg CO&#8322;e/kg</span></td>
        <td>The slide's band covers solid timber, which carries its adhesive-free mass at roughly 1.6&nbsp;kg of biogenic CO&#8322; stored per kilogramme of dry wood. Engineered panels are pressed from thinner, faster-grown stock at higher yield, so more of each harvested tree ends up in the panel and less as residue &mdash; which pushes the net figure slightly further negative even after the resin is counted.</td>
      </tr>
    </table>
    <div class="notice b" style="margin-top:14px"><b>How to write this up.</b> State the boundary in the same sentence as the number &mdash; <span class="mono">&ldquo;6005A extrusion, 155&nbsp;MJ/kg cradle-to-gate for mill product (BREE&nbsp;Marketplace, Sept&nbsp;2026); cf. 190&ndash;220&nbsp;MJ/kg for primary ingot, L9 Table&nbsp;7&rdquo;</span>. A marker cannot fault a number whose boundary is declared. A bare figure with no boundary is the thing that loses marks, whichever source it came from.</div>
  </div></div>

  <div class="sec"><div class="card pad">
    <h2>Four ways students get this wrong</h2>
    <table class="dt">
      <tr><th style="width:230px">The mistake</th><th>What to do instead</th></tr>
      <tr><td><b>Comparing per kilogramme when the design fixes a volume or a function</b></td>
        <td>A panel, a pipe wall and a liner are specified by thickness, not by mass. Multiply by density to get carbon per litre, or by the mass your design actually needs. Glass looks catastrophic per container and excellent per kilogramme — both are true, and only one is relevant.</td></tr>
      <tr><td><b>Stopping at cradle-to-gate</b></td>
        <td>These figures end at the supplier gate. For a 20-year greenhouse the heat lost through the frame, and for a plough share the replacement cycle, will both dwarf the production carbon. Say what your system boundary is and defend it.</td></tr>
      <tr><td><b>Ignoring the replacement cycle</b></td>
        <td>A material with three times the footprint that lasts five times as long wins. Normalise to a functional unit — per hectare ploughed, per year of service, per tonne of grain stored — not to the part.</td></tr>
      <tr><td><b>Treating recyclability as a material property</b></td>
        <td>It is a design property. Bolted 316L is recyclable; the same alloy bonded into a laminate is not. A mono-material lidding film recycles where a foil laminate never will. Your joining decisions determine the recovery rate more than your material choice does.</td></tr>
    </table>
  </div></div>

  <div class="sec"><div class="card pad">
    <h2>How the marketplace computes a footprint</h2>
    <p>Materials carry per-kilogramme figures. Processes — machining, welding, heat treatment, galvanising, coating — carry energy and carbon <b>per unit of process</b> instead, because a process has no mass of its own. When you build a basket, the quotation totals both, adds an estimate for outbound road freight at 0.11 kg CO₂e per tonne-kilometre over 450 km, and reports the average carbon intensity of the materials you selected.</p>
    <div class="notice b"><b>One figure worth noticing.</b> Electrically driven processes here are costed on the Québec grid, which emits roughly 1.5 g CO₂ per kWh because it is almost entirely hydro. The same CNC job run in Alberta would emit several hundred times more. Where a thing is made can matter as much as what it is made from — and that is an argument available to you in any brief involving local manufacture.</div>
    <button class="btn acc" onclick="go('/briefs')">Go to the project briefs →</button>
  </div></div>
</div>`;
}

function vHow(){
  return `<div class="wrap">
  <div class="crumb"><a onclick="go('/')">All stores</a> › How to build a quote</div>
  <h1>How to build a quote your marker will believe</h1>
  <p class="lede">Most material-selection reports lose marks in the same place: the cost column. A single number pulled from a website with no basis, no quantity and no date is not a cost estimate. Here is what a defensible one contains, and how this marketplace produces it.</p>

  <div class="sec"><div class="card pad">
    <h2>1 · Price the function, not the kilogram</h2>
    <p>A price per kilogram tells you almost nothing on its own. What your design consumes is a <em>function</em> — a beam that resists a bending moment, a panel that stops a heat flux, a pipe that contains a pressure. Convert every candidate to the cost of delivering that function before you compare.</p>
    <table class="dt" style="margin-top:10px">
      <tr><th>If the design is limited by…</th><th>Minimise…</th><th>Worked example from this catalogue</th></tr>
      <tr><td>Strength at minimum mass</td><td class="mono">ρ·C<sub>m</sub>/σ<sub>y</sub></td><td>A36 plate at $5.20/kg beats 6061-T6 at $9.85/kg on cost, but 6061 has 2.9× the specific strength — so for a mass-limited part the aluminium can still win.</td></tr>
      <tr><td>Stiffness at minimum mass</td><td class="mono">ρ·C<sub>m</sub>/E<sup>1/2</sup></td><td>FRP tube looks light until you notice E = 17 GPa against 200 for steel. Deflection, not stress, will govern your frame.</td></tr>
      <tr><td>Heat loss through an envelope</td><td class="mono">C<sub>area</sub>·U</td><td>Polyethylene film is $1.75/m² against $27.70/m² for twin-wall PC — but the film is replaced every four years and insulates far worse.</td></tr>
      <tr><td>Abrasive wear life</td><td class="mono">C<sub>part</sub>/(wear life)</td><td>AR400 at $9.75/kg lasts roughly 3× A36 at $5.20/kg. On a per-hour-of-service basis it is the cheaper plate.</td></tr>
    </table>
  </div></div>

  <div class="sec"><div class="card pad">
    <h2>2 · Include everything a real invoice includes</h2>

      <tr><td><b>Freight</b></td><td>Estimated at $45 base + $0.85/kg, with a $22 surcharge on any item over 4 m.</td><td>Mass-heavy choices carry a freight penalty that never appears on a $/kg comparison.</td></tr>
      <tr><td><b>GST + QST</b></td><td>5 % + 9.975 %, compounded as in Québec.</td><td>Taxes are 14.975 % of the subtotal. Quote your figures ex-tax and say so, or include them and say so — but be explicit.</td></tr>
    </table>
  </div></div>

  <div class="sec"><div class="card pad">
    <h2>3 · Date it, bound it, and cite it</h2>
    <p>Commodity-linked prices move. Every quotation this site generates carries a quote number, an issue date and a fourteen-day validity — copy all three into your report. A price without a date is not a price.</p>

    <span class="mono" style="display:block;margin-top:6px;font-size:12px">316L stainless sheet, 1.5 mm, 2B finish — $16.20/kg (Boréal Stainless &amp; Alloy, quote BREE-20260819-0142, 19 Aug 2026, 10 kg MOQ, ex-tax, ex-works Saint-Laurent QC).</span></div>
  </div></div>

function findLine(sku){return CART.find(l=>l.sku===sku);}
function addCart(sku,q){
  const p=BYSKU[sku]; if(!p) return;
  const l=findLine(sku);
  if(l){l.q+= (q||p.moq);}
  else CART.push({sku,q:q||p.moq,cut:false,cuts:1});
  render(); openCart(); toast(p.name+" added");
}
function addMany(list){list.forEach(k=>{if(BYSKU[k]&&!findLine(k))CART.push({sku:k,q:BYSKU[k].moq,cut:false,cuts:1});});render();openCart();toast(list.length+" line items added");}
function setQ(sku,v){const l=findLine(sku); if(!l)return; l.q=Math.max(0,+v||0); if(l.q===0)CART=CART.filter(x=>x.sku!==sku); render();}
function bump(sku,d){const l=findLine(sku),p=BYSKU[sku];const step=p.unit==="ea"||p.unit==="hr"?1:(p.unit==="kg"?5:1);setQ(sku,Math.max(0,l.q+d*step));}
function rm(sku){CART=CART.filter(x=>x.sku!==sku);render();}
function toggleCut(sku){const l=findLine(sku);l.cut=!l.cut;render();}
function setCuts(sku,v){const l=findLine(sku);l.cuts=Math.max(1,+v||1);render();}

function calc(){
  let sub=0,mass=0,cutf=0,disc=0,longItem=false,warn=[],tee=0,tco2=0,th2o=0,matMass=0;
  const lines=CART.map(l=>{
    const p=BYSKU[l.sku];
    const qty=Math.max(l.q,p.moq);
    if(l.q<p.moq) warn.push(`${p.sku}: quantity raised to the ${p.moq} ${UNITL[p.unit]} minimum order`);
    const d=breakPct(p,qty);
    const unit=p.price*(1-d/100);
    const ext=unit*qty;
    const cf=(l.cut&&p.cut)?p.cut*l.cuts:0;
    sub+=ext; cutf+=cf; disc+=p.price*qty-ext;
    mass+=(p.kgu||0)*qty;
    tee+=unitEE(p)*qty; tco2+=unitCO2(p)*qty; th2o+=unitH2O(p)*qty;
    if(p.pe===undefined) matMass+=(p.kgu||0)*qty;
    if(/6\.?1? m|6 m|6\.1 m|4\.9 m|3\.66 m/.test(p.spec)) longItem=true;
    return {p,qty,d,unit,ext,cf};
  });
  const goods=sub+cutf;
  const freight = goods>0 ? 45 + mass*0.85 + (longItem?22:0) : 0;
  const gst=(goods+freight)*GST, qst=(goods+freight)*QST;
  const fco2=mass*0.00011*450;   // 450 km road freight at 0.11 kg CO2 per tonne-km
  return {lines,sub,cutf,disc,mass,matMass,freight,gst,qst,total:goods+freight+gst+qst,goods,warn,
          tee,tco2,th2o,fco2};
}

        <tr><td colspan="5" class="n" style="background:#f1f3f6"><b>TOTAL — CAD</b></td><td class="n" style="background:#f1f3f6"><b>${money(c.total)}</b></td></tr>
      </table>
      <div style="display:flex;gap:26px;flex-wrap:wrap;font-size:11px;margin-top:8px">

      </div>

        <tr><th colspan="3">Cradle-to-gate environmental footprint of this bill of materials</th></tr>

        <tr><td>Carbon footprint, materials and processes</td><td class="n">${num(c.tco2,1)}</td><td>kg CO₂-eq</td></tr>
        ${c.th2o>0?`<tr><td>Water footprint</td><td class="n">${num(c.th2o,0)}</td><td>L</td></tr>`:""}
        ${c.matMass>0?`<tr><td>Average carbon intensity of the materials</td><td class="n">${num(c.tco2/c.matMass,2)}</td><td>kg CO₂-eq / kg</td></tr>`:""}
        <tr><td>Estimated outbound road freight, 450 km at 0.11 kg CO₂-eq per tonne-kilometre</td><td class="n">${num(c.fco2,1)}</td><td>kg CO₂-eq</td></tr>
        <tr><td style="background:#f1f3f6"><b>Total cradle-to-site carbon</b></td><td class="n" style="background:#f1f3f6"><b>${num(c.tco2+c.fco2,1)}</b></td><td style="background:#f1f3f6"><b>kg CO₂-eq</b></td></tr>
      </table>
      <div style="font-size:10.5px;color:#5d6874;margin-top:5px">Cradle-to-gate figures cover raw material extraction through to the supplier gate. They exclude the use phase and end-of-life, which for a long-lived agricultural component often dominate — state your system boundary explicitly in your report.</div>`:""}
      <div class="terms">
        <b>Terms and conditions.</b> Prices are quoted in Canadian dollars and are firm for fourteen (14) days from the issue date shown above; commodity-linked grades — stainless, nickel, aluminium and carbide in particular — are subject to re-quotation thereafter. Quantities below the stated minimum order have been rounded up to the minimum. Volume price breaks are applied automatically at the tier reached by the quantity ordered. Freight is an estimate based on consolidated mass and is confirmed at despatch. Material certification (CMTR) is not included unless line item MFW-CERT-CMTR appears above. Delivery is ex-works from the supplier locations listed; title passes on collection.<br><br>
        <b>Academic use notice.</b> BREE Marketplace is a teaching simulation created for BREE 216, Bioresource Engineering Materials, Department of Bioresource Engineering, McGill University. Prices are anchored to published August 2026 supplier and commodity data (see the Price Sources page) but the supplier entities named here are fictional and no order can be placed. Cite this quotation by its number and issue date in your material-selection report.
      </div>
    </div></div>
  </div>`;
  $("ovl").classList.add("on");
}
function copyQuote(){
  const c=calc();
  const t=["Item\tDescription\tQty\tUnit\tUnit price (CAD)\tExtended (CAD)"]
    .concat(c.lines.map(L=>[L.p.sku,L.p.name+" — "+L.p.spec,L.qty,UNITL[L.p.unit],L.unit.toFixed(2),(L.ext+L.cf).toFixed(2)].join("\t")))
    .concat(["","Subtotal\t\t\t\t\t"+c.goods.toFixed(2),"Freight\t\t\t\t\t"+c.freight.toFixed(2),
      "GST 5%\t\t\t\t\t"+c.gst.toFixed(2),"QST 9.975%\t\t\t\t\t"+c.qst.toFixed(2),
      "TOTAL\t\t\t\t\t"+c.total.toFixed(2),"","Quotation "+QN+" · issued "+new Date().toLocaleDateString("en-CA")+" · valid 14 days · BREE Marketplace"]).join("\n");
  navigator.clipboard.writeText(t).then(()=>toast("Quotation copied — paste into Excel or Word"),()=>toast("Copy blocked by the browser; use Print instead"));

function closeModal(){$("ovl").classList.remove("on");}
