function openRFQ(sku){
  closeCart();
  const p=sku?BYSKU[sku]:null;
  $("mdl").innerHTML=`<div class="mdl sm">
    <div class="mh"><h2>Request a formal quotation</h2><button class="x" onclick="closeModal()">×</button></div>
    <div class="mb" id="rfqbody">
      <p class="tiny muted" style="margin:0 0 14px">Vendors do not quote from a description alone. Everything asked for below is something a real supplier would need before putting a number on paper — which is exactly why answering it is a useful exercise.</p>
      <div class="grid" style="grid-template-columns:1fr 1fr">
        <label class="fld"><label>Your name</label><input id="r_n" placeholder="A. Student"></label>
        <label class="fld"><label>Group / team</label><input id="r_g" placeholder="BREE 216 — Group 7"></label>
      </div>
      <label class="fld"><label>Project or component</label><input id="r_p" value="${p?esc(p.name):""}" placeholder="e.g. Pellet mill die ring"></label>
      <div class="grid" style="grid-template-columns:1fr 1fr">
        <label class="fld"><label>Material / line item</label><input id="r_m" value="${p?esc(p.sku):""}" placeholder="SKU or grade"></label>
        <label class="fld"><label>Quantity &amp; unit</label><input id="r_q" placeholder="e.g. 40 kg / 12 m / 200 pcs"></label>
      </div>
      <div class="grid" style="grid-template-columns:1fr 1fr">
        <label class="fld"><label>Annual volume</label>
          <select id="r_v"><option>Prototype — 1 to 5 pieces</option><option>Small batch — 10 to 100</option><option>Production — 1 000 to 10 000</option><option>High volume — over 50 000</option></select></label>
        <label class="fld"><label>Required by</label><input id="r_d" type="date"></label>
      </div>
      <label class="fld"><label>Service environment</label>
        <select id="r_e"><option>Indoor, dry, ambient</option><option>Outdoor, Québec climate (−35 to +35 °C)</option><option>Wet / wash-down, food contact</option><option>Chemically aggressive (fertiliser, manure, silage effluent)</option><option>Elevated temperature, above 100 °C</option><option>Buried or immersed</option></select></label>
      <label class="fld"><label>Certification required</label>
        <select id="r_c"><option>None — internal prototype</option><option>Mill test report (CMTR)</option><option>3-A sanitary / food contact</option><option>Pressure code (ASME / CSA B51)</option><option>Structural (CSA S16 / S136)</option></select></label>
      <label class="fld"><label>Tolerance or finish requirement</label><input id="r_t" placeholder="e.g. Ra ≤ 0.8 µm on product contact; ±0.1 mm on bore"></label>
      <label class="fld"><label>Anything else the vendor should know</label><textarea id="r_x" rows="3" placeholder="Loading, service life, failure mode you are designing against…"></textarea></label>
      <button class="btn acc wide" onclick="submitRFQ()">Submit request</button>
      <p class="tiny muted" style="margin:10px 0 0">This is a teaching simulation — nothing is transmitted anywhere. You will receive an immediate indicative response.</p>
    </div>
  </div>`;
  $("ovl").classList.add("on");
}
function submitRFQ(){
  const g=id=>($(id)&&$(id).value||"").trim();
  const miss=[];
  if(!g("r_m"))miss.push("material / line item");
  if(!g("r_q"))miss.push("quantity");
  if(miss.length){toast("A vendor cannot quote without: "+miss.join(", "));return;}
  const sku=g("r_m").toUpperCase(), p=BYSKU[sku];
  const ref="RFQ-"+Date.now().toString().slice(-6);
  const vol=g("r_v"), cert=g("r_c"), env=g("r_e");
  let notes=[];
  if(p){
    notes.push(`Catalogue price for <b>${esc(p.name)}</b> is <b>${money(p.price)} per ${UNITL[p.unit]}</b>, ex-works ${esc(STORE[p.store].city)}, minimum order ${p.moq} ${UNITL[p.unit]}, ${p.lead} working days.`);
    if(p.cut)notes.push(`Cut-to-length is charged at ${money(p.cut)} per cut.`);
    const b=breaks(p); if(b.length)notes.push(`Volume breaks begin at ${b[0][0]} ${UNITL[p.unit]} (−${b[0][1]} %) and reach −${b[b.length-1][1]} % at ${b[b.length-1][0]} ${UNITL[p.unit]}.`);
  } else notes.push("We could not match that to a stocked line item. Please quote a catalogue SKU or an exact grade designation — “steel” is not something a vendor can price.");
  if(vol.startsWith("High")||vol.startsWith("Production"))notes.push("At this volume we would expect to quote from a mill order rather than service-centre stock; expect a further 8–15 % reduction and a 6–10 week lead time.");
  if(vol.startsWith("Prototype"))notes.push("At prototype volume the minimum order quantity, not the unit price, will dominate your cost. Budget for the full MOQ.");
  if(cert.includes("3-A"))notes.push("3-A compliance requires documented surface finish (Ra ≤ 0.8 µm on product contact), orbital welding with recorded coupons, and post-fabrication passivation. Add MFW-ORBITAL-W and MFW-PASSIVATE to your cost model.");
  if(cert.includes("CMTR"))notes.push("Mill certification is available at $45 per heat (MFW-CERT-CMTR) and must be ordered with the material.");
  if(cert.includes("Pressure"))notes.push("Pressure-code work requires a qualified welding procedure, a certified welder and volumetric NDT of every full-penetration weld (MFW-NDT-UT). This typically adds 20–35 % to fabrication cost.");
  if(env.includes("Chemically"))notes.push("For fertiliser, manure and silage effluent service we would steer you away from galvanised steel — zinc is consumed rapidly by ammonia and organic acids. Consider 316L, FRP or a polymer liner.");
  if(env.includes("Outdoor"))notes.push("At −35 °C, verify the Charpy impact requirement for your grade. Ordinary A36 has no low-temperature toughness guarantee; specify CSA G40.21 category 3 or 4 if fracture matters.");
  if(env.includes("food"))notes.push("Food-contact service constrains you to the FDA / 3-A approved materials flagged in the catalogue. Elastomer selection matters as much as the metal — EPDM swells in fats.");
  $("rfqbody").innerHTML=`
    <div class="notice g"><b>Request ${ref} received.</b> Indicative response below — a formal quotation would follow within one working day.</div>
    <h3>Application engineering notes</h3>
    <ul style="font-size:12.5px;line-height:1.7;padding-left:19px;margin:0 0 14px">${notes.map(n=>`<li>${n}</li>`).join("")}</ul>
    <div class="notice b tiny"><b>What to do with this.</b> Add the line item to your quote basket and generate a numbered quotation — that is the artefact to cite in your report. Then price the fabrication route at Macdonald Fab Works before you defend the choice.</div>
    <div style="display:flex;gap:7px;margin-top:12px">
      ${p?`<button class="btn acc" style="flex:1" onclick="closeModal();addCart('${p.sku}')">Add ${esc(p.sku)} to quote</button>`:""}
      <button class="btn gh" onclick="closeModal()">Close</button>
    </div>`;
}

function toggleCmp(sku){
  const i=CMP.indexOf(sku);
  if(i>=0)CMP.splice(i,1);
  else{ if(CMP.length>=5){toast("The comparison tray holds five items — remove one first");return;} CMP.push(sku);}
  render();
}
function setCmp(list){CMP=list.slice(0,5);render();openCmp();}
function cmpbar(){
  const el=$("cmpbar");
  if(!CMP.length){el.classList.remove("on");el.innerHTML="";return;}
  el.classList.add("on");
  el.innerHTML=`<div class="wrap">
    <b style="font-size:13px;white-space:nowrap">Comparison tray</b>
    <div class="chips">${CMP.map(k=>{const p=BYSKU[k];return `<span class="chip"><span class="sw" style="background:${SW[p.sw]||SW.svc}"></span>${esc(p.sku)}<button onclick="toggleCmp('${k}')">×</button></span>`;}).join("")}</div>
    <button class="btn sm acc" onclick="openCmp()">Compare ${CMP.length}</button>
    <button class="btn sm gh" onclick="CMP=[];render()">Clear</button>
  </div>`;
}
const CMPROWS=[
 ["h","Commercial"],
 ["price","Catalogue price",p=>money(p.price)+" / "+UNITL[p.unit],"lo",p=>p.price],
 ["pk","Normalised price",p=>perKg(p)?money(perKg(p))+" / kg":"—","lo",p=>perKg(p)??null],
 ["moq","Minimum order",p=>p.moq+" "+UNITL[p.unit],"lo",p=>p.moq],
 ["lead","Lead time",p=>p.lead+" days","lo",p=>p.lead],
 ["stock","Availability",p=>stockTxt(p.stock)[0],null,null],
 ["store","Supplier",p=>STORE[p.store].name,null,null],
 ["h","Physical &amp; mechanical"],
 ["rho","Density",p=>p.p.rho?p.p.rho.toLocaleString()+" kg/m³":"—","lo",p=>p.p.rho||null],
 ["sy","Yield strength",p=>p.p.sy?p.p.sy+" MPa":(p.p.su?"— (brittle)":"—"),"hi",p=>p.p.sy||null],
 ["su","Tensile strength",p=>p.p.su?p.p.su+" MPa":"—","hi",p=>p.p.su||null],
 ["E","Young's modulus",p=>p.p.E?p.p.E+" GPa":"—","hi",p=>p.p.E||null],
 ["el","Elongation",p=>p.p.el!==undefined?p.p.el+" %":"—","hi",p=>p.p.el??null],
 ["kic","Fracture toughness",p=>p.p.kic?p.p.kic+" MPa·m½":"—","hi",p=>p.p.kic||null],
 ["hb","Hardness",p=>p.p.hb||"—",null,null],
 ["h","Derived selection indices"],
 ["ss","Specific strength σy/ρ",p=>(p.p.sy&&p.p.rho)?(p.p.sy/p.p.rho*1000).toFixed(1)+" kN·m/kg":"—","hi",p=>(p.p.sy&&p.p.rho)?p.p.sy/p.p.rho:null],
 ["sst","Specific stiffness E/ρ",p=>(p.p.E&&p.p.rho)?(p.p.E/p.p.rho*1e6).toFixed(1)+" kN·m/kg":"—","hi",p=>(p.p.E&&p.p.rho)?p.p.E/p.p.rho:null],
 ["spd","Strength per dollar σy/(ρ·$/kg)",p=>(p.p.sy&&p.p.rho&&perKg(p))?(p.p.sy/(p.p.rho*perKg(p))*1e3).toFixed(2):"—","hi",p=>(p.p.sy&&p.p.rho&&perKg(p))?p.p.sy/(p.p.rho*perKg(p)):null],
 ["cpv","Cost per litre of material",p=>(perKg(p)&&p.p.rho)?money(perKg(p)*p.p.rho/1000):"—","lo",p=>(perKg(p)&&p.p.rho)?perKg(p)*p.p.rho/1000:null],
 ["h","Environment &amp; service"],
 ["K","Thermal conductivity",p=>p.p.K!==undefined?p.p.K+" W/m·K":"—",null,null],
 ["a","Thermal expansion",p=>p.p.a!==undefined?p.p.a+" µm/m·K":"—","lo",p=>p.p.a||null],
 ["tmax","Max service temperature",p=>p.p.tmax?p.p.tmax+" °C":"—","hi",p=>p.p.tmax||null],
 ["corr","Corrosion resistance",p=>p.p.corr?"★".repeat(p.p.corr)+"☆".repeat(5-p.p.corr):"—","hi",p=>p.p.corr||null],
 ["uv","UV resistance",p=>p.p.uv?"★".repeat(p.p.uv)+"☆".repeat(5-p.p.uv):"—","hi",p=>p.p.uv||null],
 ["food","Food-contact approved",p=>p.p.food===undefined?"—":(p.p.food?"Yes":"No"),null,null],
 ["h","Environmental indicators, per kilogramme"],
 ["ee","Embodied energy",p=>p.p.ee!==undefined?num(p.p.ee,1)+" MJ/kg":"—","lo",p=>p.p.ee??null],
 ["co2","Carbon footprint",p=>p.p.co2!==undefined?num(p.p.co2,2)+" kg CO₂e/kg":"—","lo",p=>p.p.co2??null],
 ["h2o","Water footprint",p=>p.p.h2o!==undefined?num(p.p.h2o,0)+" L/kg":"—","lo",p=>p.p.h2o??null],
 ["recy","End-of-life recovery",p=>p.p.recy!==undefined?p.p.recy+" %":"—","hi",p=>p.p.recy??null],
 ["tmin","Lowest service temperature",p=>p.p.tmin!==undefined?p.p.tmin+" °C":"—","lo",p=>p.p.tmin??null],
 ["h","Environmental indicators, per unit as supplied"],
 ["uee","Embodied energy per "+"unit",p=>unitEE(p)?num(unitEE(p),1)+" MJ / "+UNITL[p.unit]:"—","lo",p=>unitEE(p)||null],
 ["uco2","Carbon per unit",p=>unitCO2(p)?num(unitCO2(p),2)+" kg CO₂e / "+UNITL[p.unit]:"—","lo",p=>unitCO2(p)||null],
 ["h","Carbon-weighted selection indices"],
 ["cti","Carbon for a strength-limited tie, ρ·CO₂/σy",
   p=>(p.p.sy&&p.p.rho&&p.p.co2!==undefined)?num(p.p.rho*p.p.co2/p.p.sy,1)+" kg CO₂ / (kN·m⁻²)":"—",
   "lo",p=>(p.p.sy&&p.p.rho&&p.p.co2!==undefined)?p.p.rho*p.p.co2/p.p.sy:null],
 ["cbi","Carbon for a stiffness-limited beam, ρ·CO₂/E^½",
   p=>(p.p.E&&p.p.rho&&p.p.co2!==undefined)?num(p.p.rho*p.p.co2/Math.sqrt(p.p.E),0):"—",
   "lo",p=>(p.p.E&&p.p.rho&&p.p.co2!==undefined)?p.p.rho*p.p.co2/Math.sqrt(p.p.E):null],
 ["cpd","Carbon per dollar, CO₂/$ per kg",
   p=>(p.p.co2!==undefined&&perKg(p))?num(p.p.co2/perKg(p),3)+" kg CO₂ / $":"—",

function openCmp(){
  closeCart();
  if(!CMP.length){toast("Tick the box on any product card to start a comparison");return;}
  const ps=CMP.map(k=>BYSKU[k]);
  $("mdl").innerHTML=`<div class="mdl">
    <div class="mh"><h2>Material comparison — ${ps.length} candidates</h2>
      <button class="btn sm gh" onclick="window.print()">Print</button>
      <button class="btn sm gh" onclick="copyCmp()">Copy as table</button>
      <button class="x" onclick="closeModal()">×</button></div>
    <div class="mb">
      <div class="notice">Green cells mark the best value in each row <em>on that criterion alone</em>. No material wins every row — that is the whole point. Weight the rows that your brief actually cares about, then build your Pugh chart from those.</div>
      <div style="overflow-x:auto"><table class="cmp">
        <thead><tr><th></th>${ps.map(p=>`<th><div style="height:34px;border-radius:4px;background:${SW[p.sw]||SW.svc};margin-bottom:6px"></div>
          <div style="font-size:12.5px;font-weight:650">${esc(p.name)}</div>
          <div class="mono tiny muted">${esc(p.sku)}</div>
          <div class="tiny muted">${esc(p.spec)}</div></th>`).join("")}</tr></thead>
        <tbody>${CMPROWS.map(r=>{
          if(r[0]==="h")return `<tr class="sec"><td colspan="${ps.length+1}">${r[1]}</td></tr>`;
          const vals=r[4]?ps.map(r[4]):null;
          let best=null;
          if(vals&&r[3]){const f=vals.filter(v=>v!==null&&v!==undefined&&!isNaN(v));
            const uniq=new Set(f);
            if(f.length>1&&uniq.size>1)best=r[3]==="hi"?Math.max(...f):Math.min(...f);}
          return `<tr><th>${r[1]}</th>${ps.map((p,i)=>{
            const isBest=best!==null&&vals[i]===best;
            return `<td class="${isBest?"best":""}">${r[2](p)}</td>`;}).join("")}</tr>`;
        }).join("")}</tbody>
      </table></div>
      <div class="notice g" style="margin-top:14px"><b>Reading the carbon-weighted indices.</b> These are the L9 performance indices with carbon substituted for cost. <span class="mono">ρ·CO₂/σ<sub>y</sub></span> is the embodied carbon of the material needed to carry a given tensile load, and <span class="mono">ρ·CO₂/E<sup>½</sup></span> the carbon of a beam of given stiffness — lower is better in both. They exist because the lightest material is not always the lowest-carbon one, and the cheapest almost never is.</div>
      <div class="notice b" style="margin-top:10px"><b>Reading the derived cost indices.</b> “Strength per dollar” is the index to minimise for a strength-limited, cost-limited component — it is the reciprocal of Ashby's <span class="mono">ρC<sub>m</sub>/σ<sub>y</sub></span>, so higher is better. “Cost per litre” is the honest way to compare a dense material against a light one when the design fixes the <em>volume</em> rather than the mass, which is usually the case for a panel, a liner or a pipe wall.</div>
      <div style="display:flex;gap:7px;margin-top:12px">
        <button class="btn acc" onclick="closeModal();addMany(${JSON.stringify(CMP)})">Add all ${ps.length} to the quote basket</button>
        <button class="btn gh" onclick="closeModal()">Close</button>
      </div>
    </div></div>`;
  $("ovl").classList.add("on");
}
function copyCmp(){
  const ps=CMP.map(k=>BYSKU[k]);
  const t=[["Property"].concat(ps.map(p=>p.name+" ("+p.sku+")")).join("\t")]
   .concat(CMPROWS.filter(r=>r[0]!=="h").map(r=>[r[1].replace(/<[^>]+>/g,"")].concat(ps.map(p=>String(r[2](p)).replace(/★/g,"*").replace(/☆/g,""))).join("\t")))
   .join("\n");
  navigator.clipboard.writeText(t).then(()=>toast("Comparison copied — paste into Excel or Word"),()=>toast("Copy blocked; use Print instead"));
}

/* ============================================================
   Render
   ============================================================ */
function render(){
  const v=VIEW.v;
  const body = v==="store"?vStore(): v==="product"?vProduct(): v==="search"?vSearch():
               v==="briefs"?vBriefs(): v==="brief"?vBrief(): v==="sources"?vSources():
               v==="how"?vHow(): v==="env"?vEnv(): vHome();
  $("app").innerHTML=chrome(body);
  cmpbar();
  if($("drw").classList.contains("on"))$("drw").innerHTML=cartHTML();
  document.body.style.paddingBottom=CMP.length?"58px":"0";
}

render();
