# CI — Phase 0.5 complete: lint (rustfmt, clippy with the pedantic opt-in
# policy of decision 0001, ruff, mypy strict, eslint), all suites, contract
# staleness (0.3), criterion benches against the absolute budgets in
# crates/platform_core/bench-thresholds.json (decision 0004), and the web job
# (eslint, vitest, tsc, next build) since the apps/web scaffold landed
# (decision 0005). Lighthouse CI and axe join the web job at the Phase 2 gate,
# when the routes they measure exist.
#
# The jobs that carry the Phase 4 PDF gates check out with lfs: true and
# provision the pinned pdfium binary, because both are preconditions of those
# assertions running at all (decision 0046).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/platform_core
    steps:
      # lfs: true and the pdfium step below are both preconditions of the
      # Phase 4 decode and figure gates: without them those tests skip with a
      # stated reason instead of asserting anything, which is how they went
      # unverified until Phase 8.
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Provision the pinned pdfium binary (decision 0024)
        run: ../../infra/provision-pdfium.sh
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy -p tirocinium-mastery --features python -- -D warnings
      - run: cargo test --workspace
      - name: Criterion benches against absolute budgets (decision 0004)
        run: |
          cargo bench --workspace
          python3 ../../infra/check-bench-thresholds.py

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5
      - name: Provision the pinned pdfium binary (decision 0024)
        run: ../../infra/provision-pdfium.sh
      - name: Install the locked environment (Python 3.12 via uv)
        run: uv sync --locked
      - name: Build the platform_core extension into the venv
        run: VIRTUAL_ENV="$PWD/.venv" .venv/bin/maturin develop --release
          --manifest-path ../../crates/platform_core/python/Cargo.toml
      - name: Lint (ruff + mypy strict)
        run: |
          .venv/bin/ruff check .
          .venv/bin/mypy .
      - name: Python suite
        run: .venv/bin/python -m pytest -q

  setup-script:
    # The 0.2 gate itself: a fresh machine reaches a working, verified state
    # in one command. Criterion is exercised separately once benches land.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5
      - run: TIRO_SKIP_CRITERION=1 ./infra/setup.sh

  contract:
    # Phase 0.3: the seam the two developers meet at. Regenerate both
    # committed artifacts and fail on any byte difference.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Regenerate the OpenAPI spec
        run: |
          cd apps/api
          uv sync --locked
          .venv/bin/python scripts/export_openapi.py
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate the typed client
        run: |
          cd apps/web
          pnpm install --frozen-lockfile
          pnpm generate:client
      - name: Fail if a committed contract artifact is stale
        run: git diff --exit-code -- apps/api/openapi.json apps/web/src/lib/api/schema.ts

  restore-drill:
    # Phase 1 gate item: the restore drill against a fixture shard (backend
    # guide 3.5). Litestream replicates to MinIO (the drill starts the
    # compose service itself), then point-in-time and latest restores plus
    # a snapshot round trip are verified by row counts and checksums.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: cd apps/api && uv sync --locked
      - name: Install litestream
        run: |
          mkdir -p infra/bin
          curl -fsSL https://github.com/benbjohnson/litestream/releases/download/v0.3.13/litestream-v0.3.13-linux-amd64.tar.gz \
            | tar -xz -C infra/bin litestream
      - run: ./infra/restore-drill.sh

  web:
    # The web half of Phase 0.5: eslint, the Vitest suite, a production build,
    # and typecheck. tsc runs after next build because next-env.d.ts references
    # generated files under .next/types (Next 15.5); build also proves the
    # scaffold compiles, ahead of Lighthouse arriving at the Phase 2 gate.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm typecheck
