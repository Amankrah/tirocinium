# CI — Phase 0.5 scaffold, extended in 0.2 (pinned Python environment and the
# ruff/mypy gate) and 0.3 (contract staleness). Remaining stubs are marked TODO
# and filled in as their milestones land (criterion regression thresholds 0.5,
# web lint/test job once apps/web is scaffolded).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/platform_core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy -p tirocinium-mastery --features python -- -D warnings
      - run: cargo test --workspace
      # TODO(0.5): cargo criterion with regression thresholds once benches land.

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5
      - name: Install the locked environment (Python 3.12 via uv)
        run: uv sync --locked
      - name: Build the mastery extension into the venv
        run: VIRTUAL_ENV="$PWD/.venv" .venv/bin/maturin develop --release
          --manifest-path ../../crates/platform_core/mastery/Cargo.toml
      - name: Lint (ruff + mypy strict)
        run: |
          .venv/bin/ruff check .
          .venv/bin/mypy .
      - name: Store suite (7 tests)
        run: .venv/bin/python -m pytest -q

  setup-script:
    # The 0.2 gate itself: a fresh machine reaches a working, verified state
    # in one command. Criterion is exercised separately once benches land.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5
      - run: TIRO_SKIP_CRITERION=1 ./infra/setup.sh

  contract:
    # Phase 0.3: the seam the two developers meet at. Regenerate both
    # committed artifacts and fail on any byte difference.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Regenerate the OpenAPI spec
        run: |
          cd apps/api
          uv sync --locked
          .venv/bin/python scripts/export_openapi.py
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate the typed client
        run: |
          cd apps/web
          pnpm install --frozen-lockfile
          pnpm generate:client
      - name: Fail if a committed contract artifact is stale
        run: git diff --exit-code -- apps/api/openapi.json apps/web/src/lib/api/schema.ts

  # TODO: web lint/test job — eslint, vitest once apps/web is scaffolded.
