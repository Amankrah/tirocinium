# CI — Phase 0.5 scaffold, extended in 0.2 with the pinned Python environment
# (uv.lock) and the ruff/mypy gate. Remaining stubs are marked TODO and filled
# in as their milestones land (generated-client staleness 0.3, criterion
# regression thresholds 0.5, web job once apps/web is scaffolded).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/platform_core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy -p tirocinium-mastery --features python -- -D warnings
      - run: cargo test --workspace
      # TODO(0.5): cargo criterion with regression thresholds once benches land.

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5
      - name: Install the locked environment (Python 3.12 via uv)
        run: uv sync --locked
      - name: Build the mastery extension into the venv
        run: VIRTUAL_ENV="$PWD/.venv" .venv/bin/maturin develop --release
          --manifest-path ../../crates/platform_core/mastery/Cargo.toml
      - name: Lint (ruff + mypy strict)
        run: |
          .venv/bin/ruff check .
          .venv/bin/mypy .
      - name: Store suite (7 tests)
        run: .venv/bin/python -m pytest -q

  setup-script:
    # The 0.2 gate itself: a fresh machine reaches a working, verified state
    # in one command. Criterion is exercised separately once benches land.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5
      - run: TIRO_SKIP_CRITERION=1 ./infra/setup.sh

  # TODO(0.3): contract-staleness job — regenerate the typed client from
  #            openapi.json and fail if the committed client differs.
  # TODO: web job — pnpm install, eslint, vitest once apps/web is scaffolded.
