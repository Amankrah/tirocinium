# The scheduled backup drill (milestone 9.4, backend guide 3.5).
#
# CI's `restore-drill` job proves on every push that the restore mechanism
# works. That is necessary and not sufficient: it builds its own fixture, so it
# cannot see the failure that actually ends a term, which is that last night's
# snapshot job did not run or wrote nothing. This job runs on a schedule, does
# both halves against real object storage, and alerts when either fails.
#
# The release gate (phases document, Phase 9) requires this to have run on
# schedule twice, which is why it is a schedule and not a manual button; the
# manual trigger exists so the drill can be re-run after a fix without waiting
# a day.
#
# Alerting: a failure opens a GitHub issue, or comments on the open one rather
# than opening a second, so a week of failures is one thread and not seven. If
# TIRO_ALERT_WEBHOOK is configured it is posted to as well; without it the
# issue is the alert, so the job is useful before anyone wires a pager.
name: backup-drill

on:
  schedule:
    # 05:20 UTC daily, after the nightly snapshot job and early enough that a
    # missed night is caught the same morning (the verifier's window is 36 h).
    - cron: "20 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drill:
    runs-on: ubuntu-latest
    env:
      # Job level, not step level: a step's own `if` cannot see env it declares
      # itself, so the webhook check would silently never fire.
      WEBHOOK: ${{ secrets.TIRO_ALERT_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: cd apps/api && uv sync --locked

      - name: Install litestream
        run: |
          mkdir -p infra/bin
          curl -fsSL https://github.com/benbjohnson/litestream/releases/download/v0.3.13/litestream-v0.3.13-linux-amd64.tar.gz \
            | tar -xz -C infra/bin litestream

      - name: Restore drill
        id: drill
        run: ./infra/restore-drill.sh

      # The drill proves a restore; this proves the other half, that snapshots
      # are written and are really there afterwards. It runs against the same
      # MinIO the drill just used (the drill starts it), on its own small data
      # directory, because the drill deletes its own working copy as part of
      # proving the restore.
      - name: Snapshot and verify against real storage
        id: verify
        run: |
          cd apps/api
          .venv/bin/python - <<'PY'
          import pathlib, sys
          sys.path.insert(0, ".")
          from app.db.backup import s3_client_from_env
          from app.db.connection import connect
          from app.db.fixtures import build_course_shard
          from app.db.migrations import apply_migrations
          from app.db.shards import DIRECTORY_MIGRATIONS

          data = pathlib.Path("../../.drill-data")
          (data / "courses").mkdir(parents=True, exist_ok=True)
          build_course_shard(data / "courses" / "1.db", cases=3, submissions=5)
          conn = connect(data / "directory.db")
          apply_migrations(conn, DIRECTORY_MIGRATIONS)
          conn.close()
          client = s3_client_from_env()
          try:
              client.create_bucket(Bucket="tirocinium-snapshots")
          except Exception:
              pass  # already there
          PY
          .venv/bin/python scripts/snapshot_shards.py --data-dir ../../.drill-data
          .venv/bin/python scripts/verify_backups.py --data-dir ../../.drill-data \
            > "$GITHUB_WORKSPACE/backup-report.json"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backup-report
          path: backup-report.json
          if-no-files-found: ignore

      - name: Alert on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Backup drill failed';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The scheduled backup drill failed on ${new Date().toISOString()}.`,
              '',
              `Run: ${run}`,
              '',
              'A restore that has not been proven recently is not a backup.',
              'Check the run log and the backup-report.json artifact, fix the',
              'cause, then re-run this workflow manually to confirm.',
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'backup-drill',
            });

            if (existing.data.length > 0) {
              // One thread per outage, not one issue per night.
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['backup-drill'],
              });
            }

      - name: Page the on-call webhook, if one is configured
        if: failure() && env.WEBHOOK != ''
        run: |
          curl -fsS -X POST "$WEBHOOK" \
            -H 'content-type: application/json' \
            -d "{\"text\":\"Tirocinium backup drill failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}"

      - name: Close the alert thread when the drill is green again
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'backup-drill',
            });
            for (const issue of open.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: 'The backup drill passed on its next run; closing.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }
